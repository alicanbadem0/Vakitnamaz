  // ── 87. A'LÂ ──
  87:{name:"A'lâ",ayets:[
    {no:1,ar:"سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى",tr:"Sebbihisme rabbikel a'lâ."},
    {no:2,ar:"الَّذِي خَلَقَ فَسَوَّىٰ",tr:"Ellezî haleka fe sevvâ."},
    {no:3,ar:"وَالَّذِي قَدَّرَ فَهَدَىٰ",tr:"Vellezî kaddere fe hedâ."},
    {no:4,ar:"وَالَّذِي أَخْرَجَ الْمَرْعَىٰ",tr:"Vellezî ahrecel mer'â."},
    {no:5,ar:"فَجَعَلَهُ غُثَاءً أَحْوَىٰ",tr:"Fece'alehü ğüsâen ahvâ."},
    {no:6,ar:"سَنُقْرِئُكَ فَلَا تَنسَىٰ",tr:"Senukri'üke felâ tensâ."},
    {no:7,ar:"إِلَّا مَا شَاءَ اللَّهُ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ",tr:"İllâ mâ şâallâh innehü ya'lemül cehre ve mâ yahfâ."},
    {no:8,ar:"وَنُيَسِّرُكَ لِلْيُسْرَىٰ",tr:"Ve nüyessiruke lil yüsrâ."},
    {no:9,ar:"فَذَكِّرْ إِن نَّفَعَتِ الذِّكْرَىٰ",tr:"Fezekir in nefeatiz zikrâ."},
    {no:10,ar:"سَيَذَّكَّرُ مَن يَخْشَىٰ",tr:"Seyezzekkerü men yahşâ."},
    {no:11,ar:"وَيَتَجَنَّبُهَا الْأَشْقَى",tr:"Ve yerecennebühel eşkâ."},
    {no:12,ar:"الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ",tr:"Ellezî yaslennârel kübrâ."},
    {no:13,ar:"ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ",tr:"Sümme lâ yemûtü fîhâ ve lâ yahyâ."},
    {no:14,ar:"قَدْ أَفْلَحَ مَن تَزَكَّىٰ",tr:"Kad efleha men tezekkâ."},
    {no:15,ar:"وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ",tr:"Ve zekeresme rabbihî fesallâ."},
    {no:16,ar:"بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا",tr:"Bel tü'sirûnel hayâted dünyâ."},
    {no:17,ar:"وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ",tr:"Vel âhıretü hayrun ve ebkâ."},
    {no:18,ar:"إِنَّ هَٰذَا لَفِي الصُّحُفِ الْأُولَىٰ",tr:"İnne hâzâ lefis suhuful ûlâ."},
    {no:19,ar:"صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ",tr:"Suhüfi ibrâhîme ve mûsâ."},
  ]},
  // ── 88. ĞÂŞİYE ──
  88:{name:"Ğâşiye",ayets:[
    {no:1,ar:"هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ",tr:"Hel etâke hadîsül ğâşiyeh."},
    {no:2,ar:"وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ",tr:"Vücûhün yevmeizin hâşi'ah."},
    {no:3,ar:"عَامِلَةٌ نَّاصِبَةٌ",tr:"Âmiletün nâsıbeh."},
    {no:4,ar:"تَصْلَىٰ نَارًا حَامِيَةً",tr:"Taslâ nâran hâmiyeh."},
    {no:5,ar:"تُسْقَىٰ مِنْ عَيْنٍ آنِيَةٍ",tr:"Tüskâ min aynin âniyeh."},
    {no:6,ar:"لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ",tr:"Leyse lehüm taâmün illâ min darî'."},
    {no:7,ar:"لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ",tr:"Lâ yüsminü ve lâ yuğnî min cû'."},
    {no:8,ar:"وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ",tr:"Vücûhün yevmeizin nâ'imeh."},
    {no:9,ar:"لِّسَعْيِهَا رَاضِيَةٌ",tr:"Lisâ'yihâ râdıyeh."},
    {no:10,ar:"فِي جَنَّةٍ عَالِيَةٍ",tr:"Fî cennetin âliyeh."},
    {no:11,ar:"لَّا تَسْمَعُ فِيهَا لَاغِيَةً",tr:"Lâ tesmeu fîhâ lâğıyeh."},
    {no:12,ar:"فِيهَا عَيْنٌ جَارِيَةٌ",tr:"Fîhâ aynün câriyeh."},
    {no:13,ar:"فِيهَا سُرُرٌ مَّرْفُوعَةٌ",tr:"Fîhâ sürürun merfû'ah."},
    {no:14,ar:"وَأَكْوَابٌ مَّوْضُوعَةٌ",tr:"Ve ekwâbün mevdû'ah."},
    {no:15,ar:"وَنَمَارِقُ مَصْفُوفَةٌ",tr:"Ve nemârikü masfûfeh."},
    {no:16,ar:"وَزَرَابِيُّ مَبْثُوثَةٌ",tr:"Ve zerâbiyyü mebsûseh."},
    {no:17,ar:"أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ",tr:"Efelâ yenzurûne ilel ibili keyfe hulikat."},
    {no:18,ar:"وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ",tr:"Ve ilessemâi keyfe rufiat."},
    {no:19,ar:"وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ",tr:"Ve ilel cibâli keyfe nusıbet."},
    {no:20,ar:"وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ",tr:"Ve ilel ardı keyfe sütıhat."},
    {no:21,ar:"فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ",tr:"Fezekir innemâ ente müzekkin."},
    {no:22,ar:"لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ",tr:"Leste aleyhim bimusaytır."},
    {no:23,ar:"إِلَّا مَن تَوَلَّىٰ وَكَفَرَ",tr:"İllâ men tevellâ ve kefar."},
    {no:24,ar:"فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ",tr:"Feyüazzibühullâhül azâbel ekber."},
    {no:25,ar:"إِنَّ إِلَيْنَا إِيَابَهُمْ",tr:"İnne ileynâ iyâbehüm."},
    {no:26,ar:"ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم",tr:"Sümme inne aleynâ hisâbehüm."},
  ]},
  // ── 93. DUHÂ'dan 114. NÂS'a: kısa sureler tamamı ──
  93:{name:"Duhâ",ayets:[
    {no:1,ar:"وَالضُّحَىٰ",tr:"Vedduhâ."},{no:2,ar:"وَاللَّيْلِ إِذَا سَجَىٰ",tr:"Velleyli izâ secâ."},
    {no:3,ar:"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ",tr:"Mâ veddeake rabbüke ve mâ kalâ."},
    {no:4,ar:"وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ",tr:"Ve lel âhıretü hayrun leke minel ûlâ."},
    {no:5,ar:"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ",tr:"Ve le sevfe yû'tîke rabbüke fe terdâ."},
    {no:6,ar:"أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ",tr:"Elem yecidke yetîmen feâvâ."},
    {no:7,ar:"وَوَجَدَكَ ضَالًّا فَهَدَىٰ",tr:"Ve vecedeke dâllen fe hedâ."},
    {no:8,ar:"وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ",tr:"Ve vecedeke âilen feağnâ."},
    {no:9,ar:"فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ",tr:"Feemmel yetîme felâ takhar."},
    {no:10,ar:"وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ",tr:"Ve emmes sâile felâ tenher."},
    {no:11,ar:"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ",tr:"Ve emmâ bini'meti rabbike fehaddis."},
  ]},
  94:{name:"İnşirâh",ayets:[
    {no:1,ar:"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ",tr:"Elem neşrah leke sadrak."},
    {no:2,ar:"وَوَضَعْنَا عَنكَ وِزْرَكَ",tr:"Ve veda'nâ anke vizrak."},
    {no:3,ar:"الَّذِي أَنقَضَ ظَهْرَكَ",tr:"Ellezî ankada zahrak."},
    {no:4,ar:"وَرَفَعْنَا لَكَ ذِكْرَكَ",tr:"Ve refa'nâ leke zikrak."},
    {no:5,ar:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",tr:"Fe inne meale usri yüsrâ."},
    {no:6,ar:"إِنَّ مَعَ الْعُسْرِ يُسْرًا",tr:"İnne meael usri yüsrâ."},
    {no:7,ar:"فَإِذَا فَرَغْتَ فَانصَبْ",tr:"Feizâ ferağte fansab."},
    {no:8,ar:"وَإِلَىٰ رَبِّكَ فَارْغَب",tr:"Ve ilâ rabbike ferğab."},
  ]},
  95:{name:"Tîn",ayets:[
    {no:1,ar:"وَالتِّينِ وَالزَّيْتُونِ",tr:"Vettîni vez zeytûn."},
    {no:2,ar:"وَطُورِ سِينِينَ",tr:"Ve tûri sînîn."},
    {no:3,ar:"وَهَٰذَا الْبَلَدِ الْأَمِينِ",tr:"Ve hâzel beledil emîn."},
    {no:4,ar:"لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ",tr:"Lekad halaknel insâne fî ahseni takvîm."},
    {no:5,ar:"ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ",tr:"Sümme rededdinâhü esfele sâfilîn."},
    {no:6,ar:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ",tr:"İllellezîne âmenû ve amilüs sâlihâti felehüm ecrun ğayru memnûn."},
    {no:7,ar:"فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ",tr:"Femâ yükezzibüke ba'dü bid dîn."},
    {no:8,ar:"أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ",tr:"Eleyselâhü biahkemil hâkimîn."},
  ]},
  96:{name:"Alak",ayets:[
    {no:1,ar:"اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ",tr:"Ikra bismi rabbikel lezî halak."},
    {no:2,ar:"خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ",tr:"Halakal insâne min alek."},
    {no:3,ar:"اقْرَأْ وَرَبُّكَ الْأَكْرَمُ",tr:"Ikra' ve rabbukel ekrem."},
    {no:4,ar:"الَّذِي عَلَّمَ بِالْقَلَمِ",tr:"Ellezî alleme bil kalem."},
    {no:5,ar:"عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ",tr:"Allemell insâne mâ lem ya'lem."},
    {no:6,ar:"كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ",tr:"Kellâ innel insâne leyatğâ."},
    {no:7,ar:"أَن رَّآهُ اسْتَغْنَىٰ",tr:"En reâhüsteğnâ."},
    {no:8,ar:"إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ",tr:"İnne ilâ rabbikerr rüc'â."},
    {no:9,ar:"أَرَأَيْتَ الَّذِي يَنْهَىٰ",tr:"Eraeytellezî yenhâ."},
    {no:10,ar:"عَبْدًا إِذَا صَلَّىٰ",tr:"Abden izâ sallâ."},
    {no:11,ar:"أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ",tr:"Eraeyte in kâne alel hüdâ."},
    {no:12,ar:"أَوْ أَمَرَ بِالتَّقْوَىٰ",tr:"Ev emera bittakvâ."},
    {no:13,ar:"أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ",tr:"Eraeyte in kezzebe ve tevellâ."},
    {no:14,ar:"أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ",tr:"Elem ya'lem bienna allâhe yerâ."},
    {no:15,ar:"كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ",tr:"Kellâ lein lem yentehi lenasfeân binnâsıyeh."},
    {no:16,ar:"نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ",tr:"Nâsıyetin kâzibetin hâtıeh."},
    {no:17,ar:"فَلْيَدْعُ نَادِيَهُ",tr:"Felyed'u nâdiyeh."},
    {no:18,ar:"سَنَدْعُ الزَّبَانِيَةَ",tr:"Seneduz zebâniyeh."},
    {no:19,ar:"كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب",tr:"Kellâ lâ tuti'hü vescüd vakterib."},
  ]},
  97:{name:"Kadr",ayets:[
    {no:1,ar:"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ",tr:"İnnâ enzelnâhü fî leyletil kadr."},
    {no:2,ar:"وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ",tr:"Ve mâ edrâke mâ leyletül kadr."},
    {no:3,ar:"لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ",tr:"Leyletül kadri hayrun min elfi şehr."},
    {no:4,ar:"تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ",tr:"Tenezzelül melâiketü verrûhu fîhâ biizni rabbihim min külli emr."},
    {no:5,ar:"سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ",tr:"Selâmün hiye hattâ matleıl fecr."},
  ]},
  98:{name:"Beyyine",ayets:[
    {no:1,ar:"لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ",tr:"Lem yekunillezîne keferû min ehlil kitâbi vel müşrikîne münfekîne hattâ te'tiyehümül beyyineh."},
    {no:2,ar:"رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً",tr:"Resûlün minallâhi yetlû suhüfen mütahherah."},
    {no:3,ar:"فِيهَا كُتُبٌ قَيِّمَةٌ",tr:"Fîhâ kütübün kayyimeh."},
    {no:4,ar:"وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ",tr:"Ve mâ teferrakal lezîne ûtül kitâbe illâ min ba'di mâ câethumül beyyineh."},
    {no:5,ar:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ",tr:"Ve mâ ümirû illâ liя'büdüllâhe muhlisîne lehüd dîne hunefâe ve yükîmüs salâte ve yü'tüz zekâte ve zâlike dînül kayyimeh."},
    {no:6,ar:"إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا",tr:"İnnellezîne keferû min ehlil kitâbi vel müşrikîne fî nâri cehenneme hâlidîne fîhâ, ülâike hüm şerrul beriyyeh."},
    {no:7,ar:"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ",tr:"İnnellezîne âmenû ve amilüs sâlihâti ülâike hüm hayrul beriyyeh."},
    {no:8,ar:"جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ",tr:"Cezâühüm inde rabbihim cennâtü adnin tecrî min tahtihel enhâru hâlidîne fîhâ ebedâ, radıyallâhü anhüm ve radû anh, zâlike limen haşiye rabbeh."},
  ]},
  99:{name:"Zilzâl",ayets:[
    {no:1,ar:"إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا",tr:"İzâ zülziletil ardü zilzâlehâ."},
    {no:2,ar:"وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا",tr:"Ve ahreacetil ardü eskâlehâ."},
    {no:3,ar:"وَقَالَ الْإِنسَانُ مَا لَهَا",tr:"Ve kâlel insânü mâ lehâ."},
    {no:4,ar:"يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا",tr:"Yevmeizin tühaddisü ahbârehâ."},
    {no:5,ar:"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا",tr:"Bienna rabbeke evhâ lehâ."},
    {no:6,ar:"يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ",tr:"Yevmeizin yesdürun nâsü eştâten liyürev a'mâlehüm."},
    {no:7,ar:"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ",tr:"Femen ya'mel miskâle zerretin hayren yerah."},
    {no:8,ar:"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ",tr:"Ve men ya'mel miskâle zerretin şerren yerah."},
  ]},
  100:{name:"Âdiyât",ayets:[
    {no:1,ar:"وَالْعَادِيَاتِ ضَبْحًا",tr:"Vel âdiyâti dabha."},{no:2,ar:"فَالْمُورِيَاتِ قَدْحًا",tr:"Fel mûriyâti kadha."},
    {no:3,ar:"فَالْمُغِيرَاتِ صُبْحًا",tr:"Fel muğîrâti subhâ."},{no:4,ar:"فَأَثَرْنَ بِهِ نَقْعًا",tr:"Feeserne bihî nak'â."},
    {no:5,ar:"فَوَسَطْنَ بِهِ جَمْعًا",tr:"Fevesatne bihî cem'â."},{no:6,ar:"إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ",tr:"İnnel insâne lirabbihî lekenûd."},
    {no:7,ar:"وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ",tr:"Ve innehü alâ zâlike leşehîd."},{no:8,ar:"وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ",tr:"Ve innehü lihubbil hayri leşedîd."},
    {no:9,ar:"أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ",tr:"Efelâ ya'lemü izâ bu'sıra mâ fil kubûr."},
    {no:10,ar:"وَحُصِّلَ مَا فِي الصُّدُورِ",tr:"Ve hussıle mâ fis sudûr."},{no:11,ar:"إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ",tr:"İnne rabbehüm bihim yevmeizin lehebîr."},
  ]},
  101:{name:"Kâria",ayets:[
    {no:1,ar:"الْقَارِعَةُ",tr:"Elkâria."},{no:2,ar:"مَا الْقَارِعَةُ",tr:"Mel kâria."},
    {no:3,ar:"وَمَا أَدْرَاكَ مَا الْقَارِعَةُ",tr:"Ve mâ edrâke mel kâria."},{no:4,ar:"يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ",tr:"Yevme yekûnun nâsü kel ferâşil mebsûs."},
    {no:5,ar:"وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ",tr:"Ve tekûnül cibâlü kel ihnıl menfûş."},{no:6,ar:"فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ",tr:"Feemmâ men sekulet mevâzînüh."},
    {no:7,ar:"فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ",tr:"Fehüve fî îşetin râdıyeh."},{no:8,ar:"وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ",tr:"Ve emmâ men haffet mevâzînüh."},
    {no:9,ar:"فَأُمُّهُ هَاوِيَةٌ",tr:"Feümmühü hâviyeh."},{no:10,ar:"وَمَا أَدْرَاكَ مَا هِيَهْ",tr:"Ve mâ edrâke mâ hiyeh."},
    {no:11,ar:"نَارٌ حَامِيَةٌ",tr:"Nârun hâmiyeh."},
  ]},
  102:{name:"Tekâsür",ayets:[
    {no:1,ar:"أَلْهَاكُمُ التَّكَاثُرُ",tr:"Elhâkümüt tekâsür."},{no:2,ar:"حَتَّىٰ زُرْتُمُ الْمَقَابِرَ",tr:"Hattâ zürtümül mekâbir."},
    {no:3,ar:"كَلَّا سَوْفَ تَعْلَمُونَ",tr:"Kellâ sevfe ta'lemûn."},{no:4,ar:"ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ",tr:"Sümme kellâ sevfe ta'lemûn."},
    {no:5,ar:"كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ",tr:"Kellâ lev ta'lemûne ilmel yakîn."},{no:6,ar:"لَتَرَوُنَّ الْجَحِيمَ",tr:"Leterevünnel cahîm."},
    {no:7,ar:"ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ",tr:"Sümme leterevünnehâ aynel yakîn."},{no:8,ar:"ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ",tr:"Sümme letüs'elünne yevmeizin anin naîm."},
  ]},
  103:{name:"Asr",ayets:[
    {no:1,ar:"وَالْعَصْرِ",tr:"Vel asr."},{no:2,ar:"إِنَّ الْإِنسَانَ لَفِي خُسْرٍ",tr:"İnnel insâne lefî husr."},
    {no:3,ar:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",tr:"İllellezîne âmenû ve amilüs sâlihâti ve tevâsav bil hakkı ve tevâsav bis sabr."},
  ]},
  104:{name:"Hümeze",ayets:[
    {no:1,ar:"وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ",tr:"Veylün li külli hümezetin lümezeh."},
    {no:2,ar:"الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ",tr:"Ellezî cemea mâlen ve addedeh."},
    {no:3,ar:"يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ",tr:"Yahsebü enne mâlehû ahledeh."},
    {no:4,ar:"كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ",tr:"Kellâ leyünbezenne fil hutameh."},
    {no:5,ar:"وَمَا أَدْرَاكَ مَا الْحُطَمَةُ",tr:"Ve mâ edrâke mel hutameh."},
    {no:6,ar:"نَارُ اللَّهِ الْمُوقَدَةُ",tr:"Nârullâhil mûkadeh."},
    {no:7,ar:"الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ",tr:"Elletî tatteli'u alel ef'ideh."},
    {no:8,ar:"إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ",tr:"İnnehâ aleyhim mü'sadeh."},
    {no:9,ar:"فِي عَمَدٍ مُّمَدَّدَةٍ",tr:"Fî amadin mümeddedeh."},
  ]},
  105:{name:"Fîl",ayets:[
    {no:1,ar:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ",tr:"Elem tera keyfe feale rabbüke biashâbil fîl."},
    {no:2,ar:"أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ",tr:"Elem yec'al keydehüm fî tadlîl."},
    {no:3,ar:"وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ",tr:"Ve ersele aleyhim tayren ebâbîl."},
    {no:4,ar:"تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ",tr:"Termîhim bihicâratin min siccîl."},
    {no:5,ar:"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ",tr:"Fece'alehüm keasfin me'kûl."},
  ]},
  106:{name:"Kureyş",ayets:[
    {no:1,ar:"لِإِيلَافِ قُرَيْشٍ",tr:"Li'îlâfi kureyş."},{no:2,ar:"إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ",tr:"Îlâfihim rihletşşitâi vessayf."},
    {no:3,ar:"فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ",tr:"Felya'büdû rabbe hâzel beyt."},
    {no:4,ar:"الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ",tr:"Ellezî et'amehüm min cûin ve âmenehüm min havf."},
  ]},
  107:{name:"Mâûn",ayets:[
    {no:1,ar:"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ",tr:"Eraeytellezî yükezzibü bid dîn."},
    {no:2,ar:"فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ",tr:"Fezâlikel lezî yeduul yetîm."},
    {no:3,ar:"وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ",tr:"Ve lâ yehuddu alâ taâmil miskîn."},
    {no:4,ar:"فَوَيْلٌ لِّلْمُصَلِّينَ",tr:"Fe veylün lil musallîn."},{no:5,ar:"الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ",tr:"Ellezîne hüm an salâtihim sâhûn."},
    {no:6,ar:"الَّذِينَ هُمْ يُرَاءُونَ",tr:"Ellezîne hüm yürâûn."},{no:7,ar:"وَيَمْنَعُونَ الْمَاعُونَ",tr:"Ve yemne'ûnel mâ'ûn."},
  ]},
  108:{name:"Kevser",ayets:[
    {no:1,ar:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ",tr:"İnnâ a'taynâkel kevser."},
    {no:2,ar:"فَصَلِّ لِرَبِّكَ وَانْحَرْ",tr:"Fesalli lirabbike venhar."},
    {no:3,ar:"إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",tr:"İnne şâniekE hüvel ebter."},
  ]},
  109:{name:"Kâfirûn",ayets:[
    {no:1,ar:"قُلْ يَا أَيُّهَا الْكَافِرُونَ",tr:"Kul yâ eyyühel kâfirûn."},{no:2,ar:"لَا أَعْبُدُ مَا تَعْبُدُونَ",tr:"Lâ a'büdü mâ ta'büdûn."},
    {no:3,ar:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",tr:"Ve lâ entüm âbidûne mâ a'büd."},{no:4,ar:"وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ",tr:"Ve lâ ene âbidün mâ abedtüm."},
    {no:5,ar:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",tr:"Ve lâ entüm âbidûne mâ a'büd."},{no:6,ar:"لَكُمْ دِينُكُمْ وَلِيَ دِينِ",tr:"Leküm dînüküm ve liye dîn."},
  ]},
  110:{name:"Nasr",ayets:[
    {no:1,ar:"إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ",tr:"İzâ câe nasrullâhi vel feth."},
    {no:2,ar:"وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا",tr:"Ve raeeyten nâse yedhulûne fî dînillâhi efvâcâ."},
    {no:3,ar:"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا",tr:"Fesebbih bihamdi rabbike vesteğfirh innehü kâne tevvâbâ."},
  ]},
  111:{name:"Tebbet",ayets:[
    {no:1,ar:"تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ",tr:"Tebbet yedâ ebî lehebin ve tebb."},
    {no:2,ar:"مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ",tr:"Mâ ağnâ anhü mâlühü ve mâ keseb."},
    {no:3,ar:"سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ",tr:"Seyas lâ nâren zâte leheb."},
    {no:4,ar:"وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ",tr:"Vemreetühü hammâletel hatab."},
    {no:5,ar:"فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ",tr:"Fî cîdihâ hablün min mesed."},
  ]},
  112:{name:"İhlâs",ayets:[
    {no:1,ar:"قُلْ هُوَ اللَّهُ أَحَدٌ",tr:"Kul hüvallâhü ehad."},{no:2,ar:"اللَّهُ الصَّمَدُ",tr:"Allâhüs samed."},
    {no:3,ar:"لَمْ يَلِدْ وَلَمْ يُولَدْ",tr:"Lem yelid ve lem yûled."},{no:4,ar:"وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",tr:"Ve lem yekün lehû küfüven ehad."},
  ]},
  113:{name:"Felak",ayets:[
    {no:1,ar:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",tr:"Kul eûzü birabbil felak."},
    {no:2,ar:"مِن شَرِّ مَا خَلَقَ",tr:"Min şerri mâ halak."},{no:3,ar:"وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ",tr:"Ve min şerri ğâsikın izâ vekab."},
    {no:4,ar:"وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",tr:"Ve min şerrin neffâsâti fil ukad."},{no:5,ar:"وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",tr:"Ve min şerri hâsidin izâ hased."},
  ]},
  114:{name:"Nâs",ayets:[
    {no:1,ar:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ",tr:"Kul eûzü birabbin nâs."},
    {no:2,ar:"مَلِكِ النَّاسِ",tr:"Melih nâs."},{no:3,ar:"إِلَٰهِ النَّاسِ",tr:"İlâhin nâs."},
    {no:4,ar:"مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",tr:"Min şerril vesvâsil hannâs."},{no:5,ar:"الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",tr:"Ellezî yüvesvisü fî sudûrin nâs."},
    {no:6,ar:"مِنَ الْجِنَّةِ وَالنَّاسِ",tr:"Minel cinneti ven nâs."},
  ]},
  18:{name:"Kehf",ayets:[
    {no:1,ar:"الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا",tr:"Elhamdü lillâhillezî enzele alâ abdihil kitâbe ve lem yec'al lehû ivecâ."},
    {no:2,ar:"قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا",tr:"Kayyimen liyünzire be'sen şedîden min ledünhü ve yübeşşiral mü'minînellezîne ya'melûnes sâlihâti enne lehüm ecren hasenâ."},
    {no:3,ar:"مَّاكِثِينَ فِيهِ أَبَدًا",tr:"Mâkisîne fîhi ebedâ."},
    {no:4,ar:"وَيُنذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا",tr:"Ve yünzirallezîne kâlüttehazallâhü veledâ."},
    {no:5,ar:"مَّا لَهُم بِهِ مِنْ عِلْمٍ وَلَا لِآبَائِهِمْ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَاهِهِمْ إِن يَقُولُونَ إِلَّا كَذِبًا",tr:"Mâ lehüm bihî min ilmin ve lâ liâbâihim, kebüret kelimeten tahrucü min efvâhihim, in yekûlûne illâ kezibâ."},
    {no:6,ar:"فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلَىٰ آثَارِهِمْ إِن لَّمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا",tr:"Fealeeke bâhi'un nefseke alâ âsârihim in lem yü'minû bihâzel hadîsi esefâ."},
    {no:7,ar:"إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا",tr:"İnnâ ce'alnâ mâ alel ardı zînetel lehâ linebülvehüm eyyühüm ahsenü amelâ."},
    {no:8,ar:"وَإِنَّا لَجَاعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا",tr:"Ve innâ lecâilûne mâ aleyhâ saîden cüruzan."},
    {no:9,ar:"أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا",tr:"Em hasibte enne ashâbel kehfi verrâkîmi kânû min âyâtinâ acebâ."},
    {no:10,ar:"إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",tr:"İz eVel fitYetü ilel kehfi fekâlû rabbenâ âtinâ min ledünke rahmeten ve heyyi' lenâ min emrinâ raşedâ."},
    {no:11,ar:"فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا",tr:"FedaRabnâ alâ âzânihim fil kehfi sinîne adadâ."},
    {no:12,ar:"ثُمَّ بَعَثْنَاهُمْ لِنَعْلَمَ أَيُّ الْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوا أَمَدًا",tr:"Sümme be'asnâhüm lina'leme eyyül hizbeyni ahsâ limâ lebisû eme dâ."},
    {no:13,ar:"نَحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِالْحَقِّ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى",tr:"Nahnü nâkussu aleyke nebeehüm bilhakk, innehüm fityetün âmenû birabbihim ve zidnâhüm hüdâ."},
    {no:14,ar:"وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا فَقَالُوا رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ لَن نَّدْعُوَ مِن دُونِهِ إِلَٰهًا",tr:"Ve rabatNâ alâ kulûbihim iz kâmû fekâlû rabbünâ rabbüs semâvâti vel ardi len ned'uve min dûnihî ilâhâ."},
    {no:15,ar:"هَٰؤُلَاءِ قَوْمُنَا اتَّخَذُوا مِن دُونِهِ آلِهَةً لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَانٍ بَيِّنٍ",tr:"Hâülâi kavmünâttehazû min dûnihî âliheten levlâ ye'tûne aleyhim bisültânin beyyîn."},
    {no:16,ar:"فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا",tr:"Femen azlemü mimmenifterâ alallâhi kezibâ."},
    {no:17,ar:"وَإِذِ اعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا اللَّهَ فَأْوُوا إِلَى الْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِ",tr:"Ve iziae'tezetümûhüm ve mâ ya'büdûne illallâhe fe'vû ilel kehfi yenşür leküm rabbüküm min rahmetih."},
    {no:18,ar:"وَتَرَى الشَّمْسَ إِذَا طَلَعَت تَّزَاوَرُ عَن كَهْفِهِمْ ذَاتَ الْيَمِينِ",tr:"Ve tereşşemse izâ tele'at tezâveru an kehfihim zâtel yemîni."},
    {no:19,ar:"وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ وَنُقَلِّبُهُمْ ذَاتَ الْيَمِينِ وَذَاتَ الشِّمَالِ",tr:"Ve tahsebühüm eykâzan ve hüm rukûdün ve nükalLibühüm zâtel yemîni ve zâteşşimâl."},
    {no:20,ar:"لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا",tr:"Levit tela'te aleyhim le velleyte minhüm firâren ve lemüli'te minhüm ru'bâ."},
    {no:21,ar:"وَكَذَٰلِكَ بَعَثْنَاهُمْ لِيَتَسَاءَلُوا بَيْنَهُمْ",tr:"Ve kezâlike be'asnâhüm liyetesâelû beynehüm."},
    {no:22,ar:"سَيَقُولُونَ ثَلَاثَةٌ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًا بِالْغَيْبِ",tr:"Seyekûlûne selâsetün râbi'uhüm kelbühüm, ve yekûlûne hamsesün sâdisühüm kelbühüm racmen bilğayb."},
    {no:23,ar:"وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَٰلِكَ غَدًا",tr:"Ve lâ tekûlenne lişey'in innî fâilün zâlike ğadâ."},
    {no:24,ar:"إِلَّا أَن يَشَاءَ اللَّهُ وَاذْكُر رَّبَّكَ إِذَا نَسِيتَ",tr:"İllâ en yeşâallâh, vezkür rabbeke izâ nesît."},
    {no:25,ar:"وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ وَازْدَادُوا تِسْعًا",tr:"Ve lebisû fî kehfihim selâse mietetin sinîne vezDâdû tis'â."},
    {no:26,ar:"قُلِ اللَّهُ أَعْلَمُ بِمَا لَبِثُوا",tr:"Kullillâhü a'lemü bimâ lebisû."},
    {no:27,ar:"وَاتْلُ مَا أُوحِيَ إِلَيْكَ مِن كِتَابِ رَبِّكَ لَا مُبَدِّلَ لِكَلِمَاتِهِ",tr:"Vetlü mâ ûhiye ileyke min kitâbi rabbike, lâ mübeddile likelimâtih."},
    {no:28,ar:"وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ",tr:"Vasbır nefseke meallezîne yed'ûne rabbehüm bilğadâti vel aşiyyi."},
    {no:29,ar:"وَقُلِ الْحَقُّ مِن رَّبِّكُمْ فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ",tr:"Ve kulil hakku min rabbiküm, femen şâe felyü'min ve men şâe felYekfür."},
    {no:30,ar:"إِنَّا أَعْتَدْنَا لِلظَّالِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا",tr:"İnnâ a'tednâ liz zâlimîne nâren ehâta bihim surâdikühâ."},
    {no:31,ar:"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا",tr:"İnnellezîne âmenû ve amilüs sâlihâti innâ lâ nüdîu ecra men ahsene amelâ."},
    {no:32,ar:"أُولَٰئِكَ لَهُمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهِمُ الْأَنْهَارُ",tr:"Ülâike lehüm cennâtü adnin tecrî min tahtihimül enhâru."},
    {no:33,ar:"وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً",tr:"Ve yevme nüseyyirul cibâle ve teral arda bârizeten."},
    {no:34,ar:"وَعُرِضُوا عَلَىٰ رَبِّكَ صَفًّا لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَاكُمْ أَوَّلَ مَرَّةٍ",tr:"Ve urdıy alâ rabbike saffâ, lekad ci'tümûnâ kemâ halaknaküm evvele merreh."},
    {no:35,ar:"وَوُضِعَ الْكِتَابُ فَتَرَى الْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ",tr:"Ve vüdiyal kitâbu feterel mücrimîne müşfikîne mimmâ fîh."},
    {no:36,ar:"إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ",tr:"İnne hâzel kur'âne yehdî lilleti hiye akvemü."},
    {no:37,ar:"وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ",tr:"Ve iz kulnâ lil melâiketiscüdû liâdeme fesecedû illâ iblîs."},
    {no:38,ar:"أَفَتَتَّخِذُونَهُ وَذُرِّيَّتَهُ أَوْلِيَاءَ مِن دُونِي وَهُمْ لَكُمْ عَدُوٌّ",tr:"Efetettehızûnehü ve zürriyyetehû evliyâe min dûnî ve hüm leküm adüvv."},
    {no:39,ar:"مَا أَشْهَدتُّهُمْ خَلْقَ السَّمَاوَاتِ وَالْأَرْضِ",tr:"Mâ eşhettühüm halkas semâvâti vel ardi."},
    {no:40,ar:"وَيَوْمَ يَقُولُ نَادُوا شُرَكَائِيَ الَّذِينَ زَعَمْتُمْ",tr:"Ve yevme yekûlü nâdû şürekâiyellezîne zeamtüm."},
    {no:41,ar:"وَضَرَبْنَا لِكُلِّ مَثَلٍ وَلَقَدْ جِئْنَاهُم بِكِتَابٍ فَصَّلْنَاهُ عَلَىٰ عِلْمٍ",tr:"Ve darabNâ li külli meselin ve lekad ci'nâhüm bikitâbin fassalnâhü alâ ilm."},
    {no:42,ar:"هَلْ يَنظُرُونَ إِلَّا تَأْوِيلَهُ يَوْمَ يَأْتِي تَأْوِيلُهُ",tr:"Hel yenzurûne illâ te'vîleh, yevme ye'tî te'vîlühü."},
    {no:43,ar:"وَمَا كُنتَ لَدَيْهِمْ إِذْ أَجْمَعُوا أَمْرَهُمْ وَهُمْ يَمْكُرُونَ",tr:"Ve mâ künte ledeyhim iz ecme'û emrehüm ve hüm yemkürûn."},
    {no:44,ar:"وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ قَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا أَيُّ الْفَرِيقَيْنِ خَيْرٌ مَّقَامًا",tr:"Ve izâ tütlâ aleyhim âyâtünâ beyyinâtin kâlellezîne keferû lillezîne âmenû eyyül ferîkayni hayrun mekâmân."},
    {no:45,ar:"وَكَمْ أَهْلَكْنَا مِن قَرْيَةٍ بَطِرَتْ مَعِيشَتَهَا",tr:"Ve kem ehleknâ min karyetin batırat maîşetehâ."},
    {no:46,ar:"وَمَا أَرْسَلْنَا الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ",tr:"Ve mâ erselnelmürselîne illâ mübeşşirîne ve münzirîn."},
    {no:47,ar:"وَيَقُولُ الَّذِينَ كَفَرُوا لَوْلَا أُنزِلَ عَلَيْهِ آيَةٌ مِّن رَّبِّهِ",tr:"Ve yekûlullezîne keferû levlâ ünzile aleyhi âyetün min rabbih."},
    {no:48,ar:"وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ",tr:"Ve mâ nürsilül mürselîne illâ mübeşşirîne ve münzirîn."},
    {no:49,ar:"قُلْ لَّوْ كَانَ الْبَحْرُ مِدَادًا لِّكَلِمَاتِ رَبِّي",tr:"Kul lev kânel bahru midâden li kelimâti rabbî."},
    {no:50,ar:"قُل لَّوْ أَنتُمْ تَمْلِكُونَ خَزَائِنَ رَحْمَةِ رَبِّي",tr:"Kul lev entüm temlekûne hazâine rahmeti rabbî."},
    {no:51,ar:"وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِلنَّاسِ مِن كُلِّ مَثَلٍ",tr:"Ve lekad sarrafnâ fî hâzel kur'âni linnâsi min külli mesel."},
    {no:52,ar:"وَمَا مَنَعَ النَّاسَ أَن يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ",tr:"Ve mâ mene'annâse en yü'minû iz câehümül hüdâ."},
    {no:53,ar:"وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ",tr:"Ve mâ nürsilül mürselîne illâ mübeşşirîne ve münzirîn."},
    {no:54,ar:"وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ",tr:"Ve mâ erselnâke illâ rahmeten lil âlemîn."},
    {no:55,ar:"قُلْ إِنَّمَا أَنَا بَشَرٌ مِّثْلُكُمْ يُوحَىٰ إِلَيَّ",tr:"Kul innemâ ene beşerun mislüküm yûhâ ileyye."},
    {no:56,ar:"قُلِ ادْعُوا اللَّهَ أَوِ ادْعُوا الرَّحْمَٰنَ",tr:"Kulid'ullâhe evid'ür rahmân."},
    {no:57,ar:"وَإِن كَادُوا لَيَفْتِنُونَكَ عَنِ الَّذِي أَوْحَيْنَا إِلَيْكَ",tr:"Ve in kâdû leyeftinûneke anil lezî evhaynâ ileyke."},
    {no:58,ar:"وَلَوْلَا أَن ثَبَّتْنَاكَ لَقَدْ كِدتَّ تَرْكَنُ إِلَيْهِمْ شَيْئًا قَلِيلًا",tr:"Ve levlâ en sebBetenâke lekad kidte terkenu ileyhim şey'en kalîlâ."},
    {no:59,ar:"إِذًا لَّأَذَقْنَاكَ ضِعْفَ الْحَيَاةِ وَضِعْفَ الْمَمَاتِ",tr:"İzen le ezaknâke di'fel hayâti ve di'fel memât."},
    {no:60,ar:"وَإِن كَادُوا لَيَسْتَفِزُّونَكَ مِنَ الْأَرْضِ لِيُخْرِجُوكَ مِنْهَا",tr:"Ve in kâdû leyestefizzûneke minel ardı liyuhricûke minhâ."},
    {no:61,ar:"سُنَّةَ مَن قَدْ أَرْسَلْنَا قَبْلَكَ مِن رُّسُلِنَا",tr:"Sünnete men kad erselnâ kableke min rüsulinâ."},
    {no:62,ar:"أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ غَسَقِ اللَّيْلِ",tr:"Ekimis salâte lidülûkiş şemsi ilâ ğasekil leyl."},
    {no:63,ar:"وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَّكَ",tr:"Ve minel leyli feteheccedbi nâfileten lek."},
    {no:64,ar:"وَقُل رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ",tr:"Ve kul rabbi edhilnî müdhale sıdkın ve ahricnî muhrace sıdk."},
    {no:65,ar:"وَقُلْ جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ إِنَّ الْبَاطِلَ كَانَ زَهُوقًا",tr:"Ve kul câel hakku ve zehakalbâtıl, innel bâtıle kâne zehûkâ."},
    {no:66,ar:"وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ",tr:"Ve nünezzilü minel kur'âni mâ hüve şifâün ve rahmetün lil mü'minîn."},
    {no:67,ar:"وَإِذَا أَنْعَمْنَا عَلَى الْإِنسَانِ أَعْرَضَ وَنَأَىٰ بِجَانِبِهِ",tr:"Ve izâ en'amnâ alel insâni a'rade ve neâ bicânibih."},
    {no:68,ar:"قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا",tr:"Kul küllün ya'melü alâ şâkiletih, ferabbüküm a'lemü bimen hüve ehdâ sebîlâ."},
    {no:69,ar:"وَيَسْأَلُونَكَ عَنِ الرُّوحِ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي",tr:"Ve yes'elûneke anir rûhi kulir rûhu min emri rabbî."},
    {no:70,ar:"وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِالَّذِي أَوْحَيْنَا إِلَيْكَ",tr:"Ve lein şi'nâ le nezhebenné billezî evhaynâ ileyke."},
    {no:71,ar:"وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِالَّذِي أَوْحَيْنَا إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِ عَلَيْنَا وَكِيلًا",tr:"Kul leil'ectemet el insü vel cinnu alâ en ye'tû bimisli hâzel kur'âni lâ ye'tûne bimislihî ve lev kâne ba'duhüm liba'dın zahîrâ."},
    {no:72,ar:"وَلَقَدْ صَرَّفْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِن كُلِّ مَثَلٍ فَأَبَىٰ أَكْثَرُ النَّاسِ إِلَّا كُفُورًا",tr:"Ve lekad sarrafnâ linnâsi fî hâzel kur'âni min külli meselin feebâ ekserun nâsi illâ küfûrâ."},
    {no:73,ar:"وَقَالُوا لَن نُّؤْمِنَ لَكَ حَتَّىٰ تَفْجُرَ لَنَا مِنَ الْأَرْضِ يَنبُوعًا",tr:"Ve kâlû len nü'mine leke hattâ tüfcera lenâ minel ardı yenbûâ."},
    {no:74,ar:"أَوْ تَكُونَ لَكَ جَنَّةٌ مِّن نَّخِيلٍ وَعِنَبٍ فَتُفَجِّرَ الْأَنْهَارَ خِلَالَهَا تَفْجِيرًا",tr:"Ev tekûne leke cennetün min nahîlin ve inebin fetüfeccirel enhâre hilâlehâ tefcîrâ."},
    {no:75,ar:"أَوْ تُسْقِطَ السَّمَاءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا",tr:"Ev tüskıtas semâe kemâ zaemte aleynâ kisefâ."},
    {no:76,ar:"أَوْ يَكُونَ لَكَ بَيْتٌ مِّن زُخْرُفٍ أَوْ تَرْقَىٰ فِي السَّمَاءِ",tr:"Ev yekûne leke beytün min zuhrufin ev terkâ fis semâ."},
    {no:77,ar:"قُلْ سُبْحَانَ رَبِّي هَلْ كُنتُ إِلَّا بَشَرًا رَّسُولًا",tr:"Kul sübhâne rabbî hel küntü illâ beşeran resûlâ."},
    {no:78,ar:"وَمَا مَنَعَ النَّاسَ أَن يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ إِلَّا أَن قَالُوا أَبَعَثَ اللَّهُ بَشَرًا رَّسُولًا",tr:"Ve mâ mene'annâse en yü'minû iz câehümül hüdâ illâ en kâlû ebe'asallâhü beşeran resûlâ."},
    {no:79,ar:"قُل لَّوْ كَانَ فِي الْأَرْضِ مَلَائِكَةٌ يَمْشُونَ مُطْمَئِنِّينَ لَنَزَّلْنَا عَلَيْهِم مِّنَ السَّمَاءِ مَلَكًا رَّسُولًا",tr:"Kul lev kâne fil ardı melâiketün yemşûne mutmeinnîne lenezzelnâ aleyhim mines semâi meleken resûlâ."},
    {no:80,ar:"قُلْ كَفَىٰ بِاللَّهِ شَهِيدًا بَيْنِي وَبَيْنَكُمْ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا",tr:"Kul kefâ billâhi şehîden beynî ve beynekü, innehü kâne biibâdihî habîran basîrâ."},
    {no:81,ar:"وَمَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ",tr:"Ve men yehdillâhü fehüvel muhtedi."},
    {no:82,ar:"وَلَوْ أَنَّنَا نَزَّلْنَا إِلَيْهِمُ الْمَلَائِكَةَ وَكَلَّمَهُمُ الْمَوْتَىٰ",tr:"Ve lev ennenâ nezzelnâ ileyhimül melâikete ve kellemehümül mevtâ."},
    {no:83,ar:"وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِيٍّ عَدُوًّا شَيَاطِينَ الْإِنسِ وَالْجِنِّ",tr:"Ve kezâlike ce'alnâ li külli nebiyyin adüvven şeyâtînel insi vel cinn."},
    {no:84,ar:"وَلِتَصْغَىٰ إِلَيْهِ أَفْئِدَةُ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ",tr:"Ve litesgâ ileyhi ef'idetüllezîne lâ yü'minûne bil âhırah."},
    {no:85,ar:"وَلِيَقْتَرِفُوا مَا هُم مُّقْتَرِفُونَ",tr:"Ve liyakteıfû mâ hüm muktarifûn."},
    {no:86,ar:"أَفَغَيْرَ اللَّهِ أَبْتَغِي حَكَمًا وَهُوَ الَّذِي أَنزَلَ إِلَيْكُمُ الْكِتَابَ مُفَصَّلًا",tr:"Efağayrallâhi ebteğî hakemen ve hüvellezî enzele ileykümül kitâbe müfassalâ."},
    {no:87,ar:"وَهُوَ الَّذِي أَنشَأَكُم مِّن نَّفْسٍ وَاحِدَةٍ فَمُسْتَقَرٌّ وَمُسْتَوْدَعٌ",tr:"Ve hüvellezî enşeküm min nefsin vâhidetin femüstekharrun ve müstevde'."},
    {no:88,ar:"وَهُوَ الَّذِي أَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجْنَا بِهِ نَبَاتَ كُلِّ شَيْءٍ",tr:"Ve hüvellezî enzele mines semâi mâen feahrecnâ bihî nebâte külli şey'in."},
    {no:89,ar:"مِنْهَا خَضِرًا نُّخْرِجُ مِنْهُ حَبًّا مُّتَرَاكِبًا",tr:"Minhâ hadıran nuhricü minhü habben müterâkibâ."},
    {no:90,ar:"وَمِنَ النَّخْلِ مِن طَلْعِهَا قِنْوَانٌ دَانِيَةٌ",tr:"Ve minen nahli min tal'ihâ kınvânün dâniyeh."},
    {no:91,ar:"وَجَنَّاتٍ مِّنْ أَعْنَابٍ وَالزَّيْتُونَ وَالرُّمَّانَ مُشْتَبِهًا وَغَيْرَ مُتَشَابِهٍ",tr:"Ve cennâtin min a'nâbin vez zeytûne ver rummâne müştebehen ve ğayre müteşâbih."},
    {no:92,ar:"انظُرُوا إِلَىٰ ثَمَرِهِ إِذَا أَثْمَرَ وَيَنْعِهِ إِنَّ فِي ذَٰلِكُمْ لَآيَاتٍ لِّقَوْمٍ يُؤْمِنُونَ",tr:"Unzurû ilâ semerihî izâ esmera ve yen'ih, inne fî zâliküm leâyâtin likavm yü'minûn."},
    {no:93,ar:"وَجَعَلُوا لِلَّهِ شُرَكَاءَ الْجِنَّ وَخَلَقَهُمْ وَخَرَقُوا لَهُ بَنِينَ وَبَنَاتٍ بِغَيْرِ عِلْمٍ",tr:"Ve ce'alû lillâhi şürekâel cinne ve halakahüm ve harakû lehü benîne ve benâtin biğayri ilm."},
    {no:94,ar:"بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ أَنَّىٰ يَكُونُ لَهُ وَلَدٌ وَلَمْ تَكُن لَّهُ صَاحِبَةٌ",tr:"Bedîus semâvâti vel ard, ennâ yekûnü lehü veledün ve lem tekün lehü sâhibetün."},
    {no:95,ar:"ذَٰلِكُمُ اللَّهُ رَبُّكُمْ لَا إِلَٰهَ إِلَّا هُوَ خَالِقُ كُلِّ شَيْءٍ فَاعْبُدُوهُ",tr:"Zâlikümullâhü rabbüküm, lâ ilâhe illâ hüve, hâlikü külli şey'in fa'büdûh."},
    {no:96,ar:"لَّا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ",tr:"Lâ tüdrikühül ebsâru ve hüve yüdrikül ebsâra ve hüvel latîfül habîr."},
    {no:97,ar:"قَدْ جَاءَكُم بَصَائِرُ مِن رَّبِّكُمْ فَمَنْ أَبْصَرَ فَلِنَفْسِهِ",tr:"Kad câeküm besâiru min rabbiküm, femen ebsara felinerfsih."},
    {no:98,ar:"وَمَا أَنَا عَلَيْكُم بِحَفِيظٍ",tr:"Ve mâ ene aleyküm bihafîz."},
    {no:99,ar:"وَكَذَٰلِكَ نُصَرِّفُ الْآيَاتِ وَلِيَقُولُوا دَرَسْتَ",tr:"Ve kezâlike nüsarrifül âyâti ve liyekûlû dereste."},
    {no:100,ar:"اتَّبِعْ مَا أُوحِيَ إِلَيْكَ مِن رَّبِّكَ لَا إِلَٰهَ إِلَّا هُوَ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ",tr:"İttebı' mâ ûhiye ileyke min rabbike, lâ ilâhe illâ hüve ve a'rid anil müşrikîn."},
    {no:101,ar:"وَلَوْ شَاءَ اللَّهُ مَا أَشْرَكُوا",tr:"Ve lev şâallâhü mâ eşrakû."},
    {no:102,ar:"وَمَا جَعَلْنَاكَ عَلَيْهِمْ حَفِيظًا وَمَا أَنتَ عَلَيْهِم بِوَكِيلٍ",tr:"Ve mâ ce'alnâke aleyhim hafîzan ve mâ ente aleyhim biveqîl."},
    {no:103,ar:"وَلَا تَسُبُّوا الَّذِينَ يَدْعُونَ مِن دُونِ اللَّهِ فَيَسُبُّوا اللَّهَ عَدْوًا بِغَيْرِ عِلْمٍ",tr:"Ve lâ tesübbüllezîne yed'ûne min dûnillâhi feyesübbullâhe advenbigayri ilm."},
    {no:104,ar:"وَكَذَٰلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْ",tr:"Ve kezâlike zeyyennâ li külli ümmetin amelehüm."},
    {no:105,ar:"وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ لَئِن جَاءَتْهُمْ آيَةٌ لَّيُؤْمِنُنَّ بِهَا",tr:"Ve aksemû billâhi cehde eymânihim lein câet hüm âyetün le yü'minünne bihâ."},
    {no:106,ar:"وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ كَمَا لَمْ يُؤْمِنُوا بِهِ أَوَّلَ مَرَّةٍ",tr:"Ve nükalLibü ef'idetehüm ve ebsârehüm kemâ lem yü'minû bihî evvele merreh."},
    {no:107,ar:"وَلَوْ أَنَّنَا نَزَّلْنَا إِلَيْهِمُ الْمَلَائِكَةَ وَكَلَّمَهُمُ الْمَوْتَىٰ وَحَشَرْنَا عَلَيْهِمْ كُلَّ شَيْءٍ قُبُلًا",tr:"Ve lev ennenâ nezzelnâ ileyhimül melâikete ve kellemehümül mevtâ ve haşernâ aleyhim külle şey'in kubülen."},
    {no:108,ar:"وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِيٍّ عَدُوًّا مِّنَ الْمُجْرِمِينَ",tr:"Ve kezâlike ce'alnâ li külli nebiyyin adüvven minel mücrimîn."},
    {no:109,ar:"قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي",tr:"Kul hâzihî sebîlî ed'û ilallâhi alâ basîretin ene ve menittebe'anî."},
    {no:110,ar:"سُبْحَانَ اللَّهِ وَمَا أَنَا مِنَ الْمُشْرِكِينَ",tr:"Sübhânallâhi ve mâ ene minel müşrikîn."},
  ]},

  73:{name:"Müzzemmil",ayets:[
    {no:1,ar:"يَا أَيُّهَا الْمُزَّمِّلُ",tr:"Yâ eyyühel müzzemmil."},
    {no:2,ar:"قُمِ اللَّيْلَ إِلَّا قَلِيلًا",tr:"Kumilleyle illâ kalîlâ."},
    {no:3,ar:"نِّصْفَهُ أَوِ انقُصْ مِنْهُ قَلِيلًا",tr:"Nısfehû evinküs minhü kalîlâ."},
    {no:4,ar:"أَوْ زِدْ عَلَيْهِ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا",tr:"Ev zid aleyhi ve rattilil kur'âne tertîlâ."},
    {no:5,ar:"إِنَّا سَنُلْقِي عَلَيْكَ قَوْلًا ثَقِيلًا",tr:"İnnâ senülkî aleyke kavlen sekîlâ."},
    {no:6,ar:"إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْأً وَأَقْوَمُ قِيلًا",tr:"İnne nâşietel leyli hiye eşeddü vat'en ve akvemü kîlâ."},
    {no:7,ar:"إِنَّ لَكَ فِي النَّهَارِ سَبْحًا طَوِيلًا",tr:"İnne leke fin nehâri sebhan tavîlâ."},
    {no:8,ar:"وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا",tr:"Vekzikurisme rabbike ve tebettel ileyhi tebtîlâ."},
    {no:9,ar:"رَّبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا",tr:"Rabbül meşriki vel mağribi lâ ilâhe illâ hüve fettehizhü vekîlâ."},
    {no:10,ar:"وَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا",tr:"Vasbır alâ mâ yekûlûne vehcürhüm hicren cemîlâ."},
    {no:11,ar:"وَذَرْنِي وَالْمُكَذِّبِينَ أُولِي النَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا",tr:"Ve zernî vel mükezzibîne ûlin ni'meti ve mehhilhüm kalîlâ."},
    {no:12,ar:"إِنَّ لَدَيْنَا أَنكَالًا وَجَحِيمًا",tr:"İnne ledeynâ enkâlen ve cahîmâ."},
    {no:13,ar:"وَطَعَامًا ذَا غُصَّةٍ وَعَذَابًا أَلِيمًا",tr:"Ve taâmen zâ ğussatin ve azâben elîmâ."},
    {no:14,ar:"يَوْمَ تَرْجُفُ الْأَرْضُ وَالْجِبَالُ وَكَانَتِ الْجِبَالُ كَثِيبًا مَّهِيلًا",tr:"Yevme tercüful ardü vel cibâlü ve kânetil cibâlü kesîben mehîlâ."},
    {no:15,ar:"إِنَّا أَرْسَلْنَا إِلَيْكُمْ رَسُولًا شَاهِدًا عَلَيْكُمْ",tr:"İnnâ erselnâ ileykum resûlen şâhiden aleyküm."},
    {no:16,ar:"فَعَصَىٰ فِرْعَوْنُ الرَّسُولَ فَأَخَذْنَاهُ أَخْذًا وَبِيلًا",tr:"Feesâ fir'avnür resûle feehaznahü ehzen vebîlâ."},
    {no:17,ar:"فَكَيْفَ تَتَّقُونَ إِن كَفَرْتُمْ يَوْمًا يَجْعَلُ الْوِلْدَانَ شِيبًا",tr:"Fekeyfe tettekûne in kefertüm yevmen yec'alül vildâne şîbâ."},
    {no:18,ar:"السَّمَاءُ مُنفَطِرٌ بِهِ كَانَ وَعْدُهُ مَفْعُولًا",tr:"Esseamâü münfatırun bih, kâne va'dühü mef'ûlâ."},
    {no:19,ar:"إِنَّ هَٰذِهِ تَذْكِرَةٌ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا",tr:"İnne hâzihî tezkiretün femen şâettehaze ilâ rabbihî sebîlâ."},
    {no:20,ar:"إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَيِ اللَّيْلِ وَنِصْفَهُ وَثُلُثَهُ",tr:"İnne rabbeke ya'lemü enneke tekûmü ednâ min sülüseyil leyli ve nısfehû ve sülüsehû, ve tâifetün minel lezîne meake, vallâhü yükaddirul leyle vennehâr."},
  ]},

  76:{name:"İnsan",ayets:[
    {no:1,ar:"هَلْ أَتَىٰ عَلَى الْإِنسَانِ حِينٌ مِّنَ الدَّهْرِ لَمْ يَكُن شَيْئًا مَّذْكُورًا",tr:"Hel etâ alel insâni hînün mined dehri lem yekün şey'en mezkûrâ."},
    {no:2,ar:"إِنَّا خَلَقْنَا الْإِنسَانَ مِن نُّطْفَةٍ أَمْشَاجٍ نَّبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا",tr:"İnnâ halaknel insâne min nutfetin emşâcin nebtelîh, fece'alnâhü semîan basîrâ."},
    {no:3,ar:"إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا",tr:"İnnâ hedeynâhüs sebîle immâ şâkiren ve immâ kefûrâ."},
    {no:4,ar:"إِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَلَاسِلَ وَأَغْلَالًا وَسَعِيرًا",tr:"İnnâ a'tednâ lil kâfirîne selâsile ve ağlâlen ve seîrâ."},
    {no:5,ar:"إِنَّ الْأَبْرَارَ يَشْرَبُونَ مِن كَأْسٍ كَانَ مِزَاجُهَا كَافُورًا",tr:"İnnel ebrâre yeşrabûne min ke'sin kâne mizâcühâ kâfûrâ."},
    {no:6,ar:"عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا",tr:"Aynen yeşrabu bihâ ibâdullâhi yüfeccirûnehâ tefcîrâ."},
    {no:7,ar:"يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا",tr:"Yûfûne binnezri ve yahâfûne yevmen kâne şerruhu müstatîrâ."},
    {no:8,ar:"وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا",tr:"Ve yüt'imûnet taâme alâ hubbihî miskînen ve yetîmen ve esîrâ."},
    {no:9,ar:"إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنكُمْ جَزَاءً وَلَا شُكُورًا",tr:"İnnemâ nut'imüküm livechillâhi lâ nürîdü minküm cezâen ve lâ şükûrâ."},
    {no:10,ar:"إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًا قَمْطَرِيرًا",tr:"İnnâ nahâfü min rabbinâ yevmen abûsen kamtarîrâ."},
    {no:11,ar:"فَوَقَاهُمُ اللَّهُ شَرَّ ذَٰلِكَ الْيَوْمِ وَلَقَّاهُمْ نَضْرَةً وَسُرُورًا",tr:"Fevekâhümullâhü şerre zâlikel yevmi ve lakkâhüm nadıraten ve sürûrâ."},
    {no:12,ar:"وَجَزَاهُم بِمَا صَبَرُوا جَنَّةً وَحَرِيرًا",tr:"Ve cezâhüm bimâ saberû cenneten ve harîrâ."},
    {no:13,ar:"مُتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ لَا يَرَوْنَ فِيهَا شَمْسًا وَلَا زَمْهَرِيرًا",tr:"Müttekiîne fîhâ alel erâiki lâ yerevne fîhâ şemsen ve lâ zemherîrâ."},
    {no:14,ar:"وَدَانِيَةً عَلَيْهِمْ ظِلَالُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلًا",tr:"Ve dâniyeten aleyhim zilâlühâ ve zülllet kutûfühâ tezlîlâ."},
    {no:15,ar:"وَيُطَافُ عَلَيْهِم بِآنِيَةٍ مِّن فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَا",tr:"Ve yütâfu aleyhim biâniyetin min fıddatin ve ekwâbin kânet kavârîrâ."},
    {no:16,ar:"قَوَارِيرَ مِن فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا",tr:"Kavârîra min fıddatin kaddderûhâ takdîrâ."},
    {no:17,ar:"وَيُسْقَوْنَ فِيهَا كَأْسًا كَانَ مِزَاجُهَا زَنجَبِيلًا",tr:"Ve yüskavne fîhâ ke'sen kâne mizâcühâ zencebîlâ."},
    {no:18,ar:"عَيْنًا فِيهَا تُسَمَّىٰ سَلْسَبِيلًا",tr:"Aynen fîhâ tüsemmâ selsebîlâ."},
    {no:19,ar:"وَيَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَّنثُورًا",tr:"Ve yetûfu aleyhim vildânün muhalledûne izâ raeytehüm hasibetehüm lü'lüen mensûrâ."},
    {no:20,ar:"وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا",tr:"Ve izâ raeyte semme raeyte naîmen ve mülken kebîrâ."},
    {no:21,ar:"عَالِيَهُمْ ثِيَابُ سُندُسٍ خُضْرٌ وَإِسْتَبْرَقٌ وَحُلُّوا أَسَاوِرَ مِن فِضَّةٍ",tr:"Âliyehüm siyâbü sündüsin hudrun ve istabrâkun ve hüllû esâvire min fıddeh."},
    {no:22,ar:"إِنَّ هَٰذَا كَانَ لَكُمْ جَزَاءً وَكَانَ سَعْيُكُم مَّشْكُورًا",tr:"İnne hâzâ kâne leküm cezâen ve kâne sa'yüküm meşkûrâ."},
    {no:23,ar:"إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنزِيلًا",tr:"İnnâ nahnü nezzelnâ aleykel kur'âne tenzîlâ."},
    {no:24,ar:"فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ آثِمًا أَوْ كَفُورًا",tr:"Fasbır lihükmi rabbike ve lâ tüti' minhüm âsimen ev kefûrâ."},
    {no:25,ar:"وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا",tr:"Vezkürisme rabbike bükraten ve asîlâ."},
    {no:26,ar:"وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا",tr:"Ve minel leyli fescüd lehü ve sebbihhu leylen tavîlâ."},
    {no:27,ar:"إِنَّ هَٰؤُلَاءِ يُحِبُّونَ الْعَاجِلَةَ وَيَذَرُونَ وَرَاءَهُمْ يَوْمًا ثَقِيلًا",tr:"İnne hâülâi yühibbûnel âcilète ve yezerûne verâehüm yevmen sekîlâ."},
    {no:28,ar:"نَّحْنُ خَلَقْنَاهُمْ وَشَدَدْنَا أَسْرَهُمْ وَإِذَا شِئْنَا بَدَّلْنَا أَمْثَالَهُمْ تَبْدِيلًا",tr:"Nahnü halaknahüm ve şedednâ esrehüm ve izâ şi'nâ beddelnâ emsâlehüm tebdîlâ."},
    {no:29,ar:"إِنَّ هَٰذِهِ تَذْكِرَةٌ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا",tr:"İnne hâzihî tezkiretün femen şâettehaze ilâ rabbihî sebîlâ."},
    {no:30,ar:"وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا",tr:"Ve mâ teşâûne illâ en yeşâallâh, innallâhe kâne alîmen hakîmâ."},
    {no:31,ar:"يُدْخِلُ مَن يَشَاءُ فِي رَحْمَتِهِ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا",tr:"Yüdhilü men yeşâü fî rahmetih, vez zâlimîne a'adde lehüm azâben elîmâ."},
  ]},

  78:{name:"Nebe'",ayets:[
    {no:1,ar:"عَمَّ يَتَسَاءَلُونَ",tr:"Amme yetesâelûn."},
    {no:2,ar:"عَنِ النَّبَإِ الْعَظِيمِ",tr:"Anil neba-il azîm."},
    {no:3,ar:"الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ",tr:"Ellezî hüm fîhi muhtelifûn."},
    {no:4,ar:"كَلَّا سَيَعْلَمُونَ",tr:"Kellâ seyâlemûn."},
    {no:5,ar:"ثُمَّ كَلَّا سَيَعْلَمُونَ",tr:"Sümme kellâ seyâlemûn."},
    {no:6,ar:"أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا",tr:"Elem nec'alil arda mihâdâ."},
    {no:7,ar:"وَالْجِبَالَ أَوْتَادًا",tr:"Vel cibâle evtâdâ."},
    {no:8,ar:"وَخَلَقْنَاكُمْ أَزْوَاجًا",tr:"Ve halaknaküm ezvâcâ."},
    {no:9,ar:"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا",tr:"Ve cealnâ nevmeküm sübâtâ."},
    {no:10,ar:"وَجَعَلْنَا اللَّيْلَ لِبَاسًا",tr:"Ve cealnâl leyle libâsâ."},
    {no:11,ar:"وَجَعَلْنَا النَّهَارَ مَعَاشًا",tr:"Ve cealnân nehâre meâşâ."},
    {no:12,ar:"وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا",tr:"Ve beneynâ fevkaküm seb'an şidâdâ."},
    {no:13,ar:"وَجَعَلْنَا سِرَاجًا وَهَّاجًا",tr:"Ve cealnâ sirâcen vehhâcâ."},
    {no:14,ar:"وَأَنزَلْنَا مِنَ الْمُعْصِرَاتِ مَاءً ثَجَّاجًا",tr:"Ve enzelnâ minel mu'sırâti mâen seccâcâ."},
    {no:15,ar:"لِّنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا",tr:"Li nuhrice bihî habben ve nebâtâ."},
    {no:16,ar:"وَجَنَّاتٍ أَلْفَافًا",tr:"Ve cennâtin elfâfâ."},
    {no:17,ar:"إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا",tr:"İnne yevmel fasli kâne mîkâtâ."},
    {no:18,ar:"يَوْمَ يُنفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا",tr:"Yevme yünfahu fis sûri fe te'tûne efvâcâ."},
    {no:19,ar:"وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا",tr:"Ve fütihetis semâü fekânet ebvâbâ."},
    {no:20,ar:"وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا",tr:"Ve süyyiretil cibâlü fekânet serâbâ."},
    {no:21,ar:"إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا",tr:"İnne cehenneme kânet mirsâdâ."},
    {no:22,ar:"لِّلطَّاغِينَ مَآبًا",tr:"Lit tâğîne meâbâ."},
    {no:23,ar:"لَّابِثِينَ فِيهَا أَحْقَابًا",tr:"Lâbisîne fîhâ ahkâbâ."},
    {no:24,ar:"لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا",tr:"Lâ yezûkûne fîhâ berden ve lâ şerâbâ."},
    {no:25,ar:"إِلَّا حَمِيمًا وَغَسَّاقًا",tr:"İllâ hamîmen ve ğassâkâ."},
    {no:26,ar:"جَزَاءً وِفَاقًا",tr:"Cezâen vifâkâ."},
    {no:27,ar:"إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا",tr:"İnnehüm kânû lâ yercûne hisâbâ."},
    {no:28,ar:"وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا",tr:"Ve kezzebû biâyâtinâ kizzâbâ."},
    {no:29,ar:"وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا",tr:"Ve külle şey'in ahsaynâhü kitâbâ."},
    {no:30,ar:"فَذُوقُوا فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا",tr:"Fezûkû felen nezîdeküm illâ azâbâ."},
    {no:31,ar:"إِنَّ لِلْمُتَّقِينَ مَفَازًا",tr:"İnne lil müttekîne mefâzâ."},
    {no:32,ar:"حَدَائِقَ وَأَعْنَابًا",tr:"Hadâika ve a'nâbâ."},
    {no:33,ar:"وَكَوَاعِبَ أَتْرَابًا",tr:"Ve kevâibe etrâbâ."},
    {no:34,ar:"وَكَأْسًا دِهَاقًا",tr:"Ve ke'sen dihâkâ."},
    {no:35,ar:"لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا",tr:"Lâ yesme'ûne fîhâ lağven ve lâ kizzâbâ."},
    {no:36,ar:"جَزَاءً مِّن رَّبِّكَ عَطَاءً حِسَابًا",tr:"Cezâen min rabbike atâen hisâbâ."},
    {no:37,ar:"رَّبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ",tr:"Rabbis semâvâti vel ardı ve mâ beynehumar rahmân, lâ yemlikûne minhü hitâbâ."},
    {no:38,ar:"يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا لَّا يَتَكَلَّمُونَ",tr:"Yevme yekûmür rûhu vel melâiketü saffan lâ yetekellemûne illâ men ezine lehür rahmânü ve kâle savâbâ."},
    {no:39,ar:"ذَٰلِكَ الْيَوْمُ الْحَقُّ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا",tr:"Zâlikel yevmül hakk, femen şâettehaze ilâ rabbihî meâbâ."},
    {no:40,ar:"إِنَّا أَنذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ",tr:"İnnâ enzernâküm azâben karîben yevme yenzurul mer'ü mâ kaddemet yedâhü ve yekûlül kâfiru yâ leytenî küntü türâbâ."},
  ]},

let _actx;
function _ac(){_actx=_actx||new (window.AudioContext||window.webkitAudioContext)();return _actx;}
function _tone(freq,start,dur,type,gain){
  const c=_ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  o.connect(g);g.connect(c.destination);
  const t=c.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain||0.3,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur);
}

function checkReminder(){

  const now=new Date();

  for(const p of PR){

function today(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function prayDay(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes(),fm=t2m(S.times.sabah);
  if(nm<fm){const y=new Date(n);y.setDate(y.getDate()-1);return`${y.getFullYear()}-${p2(y.getMonth()+1)}-${p2(y.getDate())}`;}
  return today();
}
function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
// Kerahat vakitleri: namaz kılmanın mekruh olduğu 3 süre (yaklaşık, Diyanet kaynaklı)
function getKerahat(){
  if(!S.times.gunes||!S.times.ogle||!S.times.aksam)return null;
  const nm=nowM();
  const gunes=t2m(S.times.gunes),ogle=t2m(S.times.ogle),aksam=t2m(S.times.aksam);
  const windows=[
    {start:gunes,end:gunes+45,label:'Güneşin Doğuşu',desc:'Güneş doğduktan itibaren yaklaşık 45 dakika (işrak vaktine kadar)'},
    {start:ogle-45,end:ogle,label:'Zeval Vakti',desc:'Öğle ezanına yaklaşık 45 dakika kalmasından öğle vaktinin girişine kadar'},
    {start:aksam-45,end:aksam,label:'Güneşin Batışı',desc:'Akşam ezanına yaklaşık 45 dakika kala, güneş sararıp batışına kadar'},
  ];
  for(const w of windows){if(nm>=w.start&&nm<w.end)return{...w,remain:w.end-nm};}
  return null;
}
function nowM(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function nowS(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}
function activePrayer(){
  const nm=nowM(),fm=t2m(S.times.sabah);
  if(nm<fm)return'yatsi';
  let a=null;PR.forEach(p=>{if(nm>=t2m(S.times[p]))a=p;});return a;
}
function nextPrayer(){
  const nm=nowM();
  for(const p of PR){const t=t2m(S.times[p]);if(t>nm)return{name:p,time:S.times[p],mins:t-nm};}
  return{name:'sabah',time:S.times.sabah,mins:0};
}
// Saniye hassasiyetli sıradaki namaz (geri sayım için)
function nextPrayerSec(){
  const ns=nowS();
  for(const p of PR){const t=t2m(S.times[p])*60;if(t>ns)return{name:p,time:S.times[p],secs:t-ns};}
  // Yatsıdan sonra: ertesi gün sabaha kadar
  const t=t2m(S.times.sabah)*60+86400;
  return{name:'sabah',time:S.times.sabah,secs:t-ns};
}
function cdStrSec(s){
  if(s<=0)return'Şimdi';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return`${h}:${p2(m)}:${p2(sec)}`;
  return`${p2(m)}:${p2(sec)}`;
}
function cdStr(m){if(m<=0)return'Şimdi';const h=Math.floor(m/60),r=m%60;return h?`${h}s ${r}dk`:`${r} dakika`;}
function mm2t(min){min=((min%1440)+1440)%1440;return p2(Math.floor(min/60))+':'+p2(min%60);}
// Ana sayaç hedefi: kerahat içindeysek ÖNCE kerahat bitişine say, kerahat yoksa sıradaki vakte say.
// (Sabah namazının vakti güneş doğunca biter; öğleye kadar beklemek yanlış olur.)
function mainCountdown(){
  const ker=getKerahat();
  const nx=nextPrayerSec();
  if(ker){
    const secs=Math.max(0,ker.end*60-nowS());
    return{isKerahat:true,secs,label:'KERAHAT VAKTİ ÇIKMASINA',name:ker.label,timeStr:mm2t(ker.end),icon:'⏳',afterName:PN[nx.name],afterTime:nx.time};
  }
  // Sabah/İmsak vakti hâlâ devam ediyorsa (güneş henüz doğmadıysa), öğleye atlamadan
  // önce GÜNEŞE (Sabah vaktinin sona erdiği ana) say.
  if(S.times.gunes){
    const gunesM=t2m(S.times.gunes),nm=nowM(),sabahM=t2m(S.times.sabah);
    if(nm>=sabahM&&nm<gunesM){
      const secs=Math.max(0,gunesM*60-nowS());
      return{isKerahat:false,secs,label:'VAKTİN ÇIKMASINA',name:'Güneş',timeStr:S.times.gunes,icon:'🌅'};
    }
  }
  return{isKerahat:false,secs:nx.secs,label:'VAKTİN ÇIKMASINA',name:PN[nx.name],timeStr:S.times[nx.name],icon:PI[nx.name]};
}
function getEntry(p){
  const d=prayDay();
  if(!S.prog[d])S.prog[d]={};
  if(!S.prog[d][p])S.prog[d][p]={hadis:false,kuran:false,done:false};
  return S.prog[d][p];
}
function dayPct(){

  for(let i=0;i<=idx;i++){const e=S.prog[d]&&S.prog[d][PR[i]];if(e&&e.done)done++;}

}

async function doUpd(btn){
  if(btn)btn.style.animation='spin 1s linear infinite';

  // Önce konumu dene, sonra o ile göre vakitleri çek
  try{
    const co=await getPosition();
    S.coords=co;
    const city=nearestCity(co.lat,co.lng);
    if(city)S.city=city;

      <button class="dt-btn ${showTr?'on':''}" onclick="toggleDispFlow('showTr')">Okunuş</button>

    listH=`<div class="empty-st"><div class="ei">${tab==='favoriler'?'⭐':'🔍'}</div><div class="et">${tab==='favoriler'?'Favori sure yok':'Bulunamadı'}</div><div class="es">${tab==='favoriler'?'Sure listesinden ⭐ ile ekleyebilirsiniz':'Farklı arama deneyin'}</div></div>`;
  } else {
    show.forEach(s=>{
      const fav=favs.includes(s.no);

function markLastRead(no,ayahNo){
  const meta=KURAN_LISTE.find(s=>s.no===no);
  S.lastRead={no,ayahNo,name:meta?meta.name:('Sure '+no)};

async function continueReading(){
  if(!S.lastRead)return;
  const{no,ayahNo}=S.lastRead;
  await openSureLocal(no);
  // Veri (özellikle ilk API çekimi) gelene kadar kısa süre bekle
  let tries=0;
  while((!S.kuranRdr||!S.kuranRdr.data)&&tries<50){await new Promise(r=>setTimeout(r,100));tries++;}
  if(S.kuranRdr&&S.kuranRdr.data){
    S.kuranRdr.page=Math.max(1,Math.ceil(ayahNo/S.kuranRdr.perPage));
    showSureRdr();
    setTimeout(()=>{
      const el=document.getElementById('ayet-'+no+'-'+ayahNo);
      if(el){
        el.scrollIntoView({behavior:'smooth',block:'center'});
        el.classList.add('ayet-highlight');
        setTimeout(()=>el.classList.remove('ayet-highlight'),2200);
      }
    },180);
  }
}

function toggleFav(no){
  if(!S.favSures)S.favSures=[];
  const i=S.favSures.indexOf(no);
  if(i>=0){S.favSures.splice(i,1);toast('Favoriden çıkarıldı');}
  else{S.favSures.push(no);toast('Favorilere eklendi ⭐');}
  save();render();
}

async function openSureLocal(no){
  const meta=KURAN_LISTE.find(s=>s.no===no);
  const name=meta?meta.name:('Sure '+no);

  // 1) Yerleşik veri (namaz akışı sureleri) — internetsiz de açılır
  let localAyets=null;
  const sureData=KURAN_SURES[no];
  if(sureData){
    if(sureData.fromFlow){const f=SURAHS[sureData.fromFlow];localAyets=f?f.ayets:null;}
    else localAyets=sureData.ayets;
  }

  // 2) Cache'te tam sure var mı?
  if(isSurahCached(no)){
    const d=await getSurah(no);
    if(d){S.kuranRdr={no,name,data:d.ayets,page:1,perPage:30};showSureRdr();return;}
  }

  // 3) Yerleşik veri varsa önce onu göster (anında), sonra arka planda API ile zenginleştir
  if(localAyets&&localAyets.length){
    S.kuranRdr={no,name,data:localAyets.map(a=>({no:a.no,ar:a.ar,tr:a.tr,meal:a.meal||''})),page:1,perPage:30};
    showSureRdr();
    // arka planda meal/tam veri çek
    getSurah(no).then(d=>{if(d&&S.kuranRdr&&S.kuranRdr.no===no){S.kuranRdr.data=d.ayets;showSureRdr();}});
    return;
  }

  // 4) Yerleşik yok → API'den çek (yükleniyor göster)
  S.kuranRdr={no,name,data:null,page:1,perPage:30,loading:true};
  showSureRdr();
  const d=await getSurah(no);
  if(!d){
    S.kuranRdr.loading=false;S.kuranRdr.error=true;showSureRdr();return;
  }
  if(S.kuranRdr&&S.kuranRdr.no===no){S.kuranRdr={no,name,data:d.ayets,page:1,perPage:30};showSureRdr();}
}
function openSure(no){return openSureLocal(no);}

function renderZikir(c){
  const td=today();
  if(!S.zikirList)S.zikirList=[];
  const act=S.zikirList.find(z=>z.id===S.activeZikir);

  // Başparmak bölgesinde sabit duran sayaç barı (ekranda her zaman aynı yerde,
  // yukarı kaydırmaya gerek kalmadan dokunulabilir)
  let fabH='';
  if(act){
    if(!act.counts)act.counts={};
    const cnt=act.counts[td]||0,tgt=act.target||100,done=cnt>=tgt,pct=Math.min(100,cnt/tgt*100);
    fabH=`<div class="zk-fab-bar">
      <div class="zk-fab-inner">
        ${act.arabic?`<div class="zk-fab-ar">${escHtml(act.arabic)}</div>`:''}
        <div class="zk-fab-name">${escHtml(act.name)}</div>
        <div class="zk-circle-wrap" id="zring" style="--p:${pct}">

          </div>

          <button class="zk-reset-link" onclick="event.stopPropagation();resetZ()">Sıfırla</button>

        <div class="mini-prog" style="margin-top:4px"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
      <button onclick="event.stopPropagation();delZ('${z.id}')" aria-label="Zikri sil" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--tl);padding:3px">🗑</button>
    </div>`;
  });

  <div class="hdr">

function openAddZ(){
  openMod(`<div class="mtitle">📿 Yeni Zikir Ekle</div>
    <input id="zi-name" class="std-inp" placeholder="Zikir adı (örn: Estağfirullah)">
    <input id="zi-ar" class="std-inp" placeholder="Arapça metin (isteğe bağlı)" style="font-family:'Amiri',serif;font-size:18px;direction:rtl">

      ${[33,99,100,313,500,1000].map(n=>`<button class="z-quick" onclick="document.getElementById('zi-tgt').value=${n}">${n}</button>`).join('')}

function selZ(id){S.activeZikir=id;save();render();}
function tapZ(d){
  const z=S.zikirList.find(x=>x.id===S.activeZikir);if(!z)return;
  const td=today();if(!z.counts)z.counts={};
  let cnt=z.counts[td]||0;
  cnt=Math.max(0,Math.min(z.target,cnt+d));
  z.counts[td]=cnt;save();
  const el=document.getElementById('zcnt'),ring=document.getElementById('zring'),rem=document.getElementById('zrem');
  const pct=Math.min(100,cnt/z.target*100),done=cnt>=z.target;
  if(el){el.textContent=cnt;if(d>0){el.classList.add('ck');setTimeout(()=>el.classList.remove('ck'),300);}}
  if(ring)ring.style.setProperty('--p',pct);
  if(rem)rem.textContent=done?'✅ Tamam':'/ '+z.target;
  if(navigator.vibrate)navigator.vibrate(15);
  if(d>0&&cnt>=z.target){toast(`${z.name} tamamlandı! 🎉`);if(navigator.vibrate)navigator.vibrate([80,40,80]);setTimeout(()=>render(),700);}
}
function resetZ(){const z=S.zikirList.find(x=>x.id===S.activeZikir);if(!z)return;if(!z.counts)z.counts={};z.counts[today()]=0;save();render();}
function delZ(id){if(!confirm('Bu zikiri silmek istiyor musunuz?'))return;S.zikirList=S.zikirList.filter(z=>z.id!==id);if(S.activeZikir===id)S.activeZikir=null;save();render();}
function addZ(){
  const name=document.getElementById('zi-name').value.trim();
  const ar=document.getElementById('zi-ar').value.trim();
  const tgt=parseInt(document.getElementById('zi-tgt').value)||33;
  if(!name){toast('Lütfen zikir adı girin');return;}
  if(!S.zikirList)S.zikirList=[];
  const id='z_'+Date.now();
  S.zikirList.push({id,name,arabic:ar||null,target:tgt,counts:{}});
  S.activeZikir=id;save();
  const mv=document.getElementById('mov');if(mv)mv.classList.remove('open');
  toast('Zikir eklendi 📿');render();
}

function renderTakvim(c){
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  const fd=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),td=now.getDate();
  const mname=now.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  const dl=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let dH=dl.map(d=>`<div class="cal-dl">${d}</div>`).join('');
  const offset=(fd===0?6:fd-1);
  for(let i=0;i<offset;i++)dH+=`<div class="cal-d empty"></div>`;
  const ayHolidays=[];
  for(let d=1;d<=dim;d++){
    const ds=`${yr}-${p2(mo+1)}-${p2(d)}`;
    const prog=S.prog[ds];let cls='cal-d';let dot='';
    if(prog){const dn=Object.values(prog).filter(v=>v.done).length,tot=Object.keys(prog).length;
      if(dn>0&&dn===tot){cls+=' full';dot='<div class="dot"></div>';}
      else if(dn>0){cls+=' part';dot='<div class="dot"></div>';}}
    const hol=DINI_GUNLER[ds];
    let holMark='';
    if(hol){cls+=' holiday';holMark=`<div class="cal-hol">${hol.ico}</div>`;ayHolidays.push({d,...hol});}
    if(d===td)cls+=' today';
    dH+=`<div class="${cls}" onclick="showDay('${ds}')">${d}${holMark}${dot}</div>`;
  }
  let tot=0,done=0;
  for(let d=1;d<=td;d++){const ds=`${yr}-${p2(mo+1)}-${p2(d)}`;const prog=S.prog[ds];if(prog)Object.values(prog).forEach(e=>{tot++;if(e.done)done++;});}
  const pct=tot?Math.round(done/tot*100):0;

  // Bu ayın dini günleri listesi
  let holH='';
  if(ayHolidays.length){
    holH=`<div class="card"><div class="card-title" style="margin-bottom:8px">🌙 Bu Ayın Dini Günleri</div>`;
    ayHolidays.forEach(h=>{holH+=`<div class="hol-item"><span class="hol-ico">${h.ico}</span><span class="hol-day">${h.d} ${mname.split(' ')[0]}</span><span class="hol-name">${h.ad}</span></div>`;});
    holH+=`</div>`;
  }

  // Sonraki yaklaşan dini gün (bu ayda yoksa)
  let nextHol='';
  if(!ayHolidays.length){
    const todayStr=`${yr}-${p2(mo+1)}-${p2(td)}`;
    const upcoming=Object.entries(DINI_GUNLER).filter(([k])=>k>=todayStr).sort()[0];
    if(upcoming){
      const[k,v]=upcoming;const hd=new Date(k+'T12:00:00');
      const gun=hd.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
      nextHol=`<div class="card"><div class="card-title" style="margin-bottom:4px">🌙 Yaklaşan Dini Gün</div><div class="hol-item"><span class="hol-ico">${v.ico}</span><span class="hol-day">${gun}</span><span class="hol-name">${v.ad}</span></div></div>`;
    }
  }

  c.innerHTML=`<div class="hdr"><div class="hbism" style="font-size:16px;margin-bottom:3px">İbadet Takvimi</div><div class="htitle" style="font-size:16px">${mname}</div></div>
  <div style="padding:14px 14px 40px" class="fi">
    <div class="cal-info">📅 Bu takvim namaz ibadetlerini takip etmeni sağlar. Tamamladığın günler renklenir; bir güne dokunarak o günün durumunu görebilirsin. 🌙 işaretli günler dini özel günlerdir.</div>
    <div class="cal-leg">
      <div class="cal-li"><div class="cal-ld" style="background:var(--g2)"></div>Tamamlandı</div>
      <div class="cal-li"><div class="cal-ld" style="background:var(--gp)"></div>Kısmi</div>
      <div class="cal-li"><div class="cal-ld" style="background:var(--cm)"></div>Yapılmadı</div>
      <div class="cal-li"><span style="font-size:11px">🌙</span>Dini Gün</div>
    </div>
    <div class="cal-grid">${dH}</div>
    ${holH}${nextHol}
    <div class="card">
      <div class="card-hdr"><div class="card-title">Bu Ay</div><div class="prog-pct">%${pct}</div></div>
      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div style="margin-top:8px;font-size:12px;color:var(--tl)">${done} / ${tot} görev tamamlandı</div>
    </div>
  </div>`;
}
function showDay(ds){
  const hol=DINI_GUNLER[ds];
  const prog=S.prog[ds];
  if(!prog&&!hol){toast('Bu gün için kayıt yok');return;}
  let h=`<div class="mtitle">📅 ${new Date(ds+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div>`;
  if(hol)h+=`<div style="background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;text-align:center"><div style="font-size:26px">${hol.ico}</div><div style="font-weight:800;font-size:15px;margin-top:3px">${hol.ad}</div></div>`;
  if(prog)PR.forEach(p=>{const e=prog[p];if(!e)return;h+=`<div class="dua-list-item"><div class="dli-txt">${PI[p]} ${PN[p]}: ${e.done?'✅ Tamamlandı':'⬜ Tamamlanmadı'}</div></div>`;});
  openMod(h);
}

async function fetchTimes(city,msg){
  try{
    if(msg)toast('Vakitler güncelleniyor...');
    const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Turkey&method=13`);
    const d=await r.json();
    if(d.code===200){
      const t=d.data.timings;
      S.times={sabah:t.Fajr.slice(0,5),gunes:t.Sunrise.slice(0,5),ogle:t.Dhuhr.slice(0,5),ikindi:t.Asr.slice(0,5),aksam:t.Maghrib.slice(0,5),yatsi:t.Isha.slice(0,5)};
      S.lastUpd=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
      save();if(msg)toast('✅ Vakitler güncellendi!');
      if(S.screen==='home')render();
      scheduleAllPrayerNotifications();
    }
  }catch(e){if(msg)toast('Güncelleme başarısız (offline)');}
}

// Konumdan en yakın ili bul
// ═══════════════════════════════════════════
//  KONUM — Native (Capacitor) + Web ortak
// ═══════════════════════════════════════════
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());}
// Ortak konum alma: APK'da native eklenti, tarayıcıda web API
async function getPosition(){
  // 1) Native (Capacitor Geolocation)
  if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation){
    const G=window.Capacitor.Plugins.Geolocation;
    try{
      // İzin kontrol + iste
      let perm=await G.checkPermissions();
      if(perm.location!=='granted'&&perm.coarseLocation!=='granted'){
        perm=await G.requestPermissions();
      }
      if(perm.location!=='granted'&&perm.coarseLocation!=='granted'){
        throw {code:1,message:'İzin verilmedi'};
      }
      const pos=await G.getCurrentPosition({enableHighAccuracy:true,timeout:15000});
      return {lat:pos.coords.latitude,lng:pos.coords.longitude};
    }catch(e){
      throw {code:(e&&e.code)||2,message:(e&&e.message)||'Konum alınamadı'};
    }
  }
  // 2) Web (tarayıcı)
  if(!navigator.geolocation)throw {code:2,message:'Cihaz konumu desteklemiyor'};
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>rej({code:e.code,message:e.message}),
      {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
    );
  });
}

function nearestCity(lat,lng){
  let best=null,bestD=Infinity;
  for(const c in CITY_COORDS){
    const[cl,cn]=CITY_COORDS[c];
    const d=(cl-lat)*(cl-lat)+(cn-lng)*(cn-lng);
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}
async function detectLocation(){
  toast('📍 Konum alınıyor...');
  try{
    const co=await getPosition();
    S.coords=co;
    const city=nearestCity(co.lat,co.lng);
    if(city)S.city=city;
    save();
    toast('📍 Konum bulundu, hassas vakitler çekiliyor...');
    reverseGeocodeDistrict(co.lat,co.lng);
    const ok=await fetchTimesByCoords(co.lat,co.lng,true);
    if(!ok&&city)await fetchTimes(city,true); // yedek: hassas çekim başarısızsa il bazlı dene
    render();
  }catch(e){
    toast(e.code===1?'Konum izni verilmedi':'Konum alınamadı');
  }
}

const KAABE={lat:21.4225,lng:39.8262};
// Bulunulan konumdan Kâbe'ye olan açı (kuzeyden saat yönünde, derece)
function qiblaBearing(lat,lng){
  const toR=d=>d*Math.PI/180, toD=r=>r*180/Math.PI;
  const dLng=toR(KAABE.lng-lng);
  const y=Math.sin(dLng)*Math.cos(toR(KAABE.lat));
  const x=Math.cos(toR(lat))*Math.sin(toR(KAABE.lat))-Math.sin(toR(lat))*Math.cos(toR(KAABE.lat))*Math.cos(dLng);
  let b=toD(Math.atan2(y,x));
  return (b+360)%360;
}
// Aktif konum koordinatı (GPS varsa o, yoksa şehir merkezi)
function activeCoords(){
  if(S.coords)return S.coords;
  const c=CITY_COORDS[S.city];
  if(c)return{lat:c[0],lng:c[1]};
  return{lat:41.01,lng:28.98}; // varsayılan İstanbul
}

//  YAKIN CAMİLER (OpenStreetMap · Overpass API)
// ══════════════════════════════════════════════
let mosqueState={loading:false,error:false,list:null,fromCoords:null};
// Haversine: iki nokta arası metre
function distMeters(lat1,lng1,lat2,lng2){
  const R=6371000,toR=d=>d*Math.PI/180;
  const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(m){
  if(m<1000)return Math.round(m)+' m';
  return (m/1000).toFixed(1)+' km';
}
// Yürüme süresi tahmini (~80 m/dk)
function walkMin(m){return Math.max(1,Math.round(m/80));}

async function findMosques(force){
  const co=S.coords; // sadece GERÇEK GPS ile (şehir merkezi yakın cami için anlamsız)
  if(!co){mosqueState={loading:false,error:'noloc',list:null};renderMosqueCard();return;}
  // Aynı konumdan tekrar çekme (50m'den az hareket)
  if(!force&&mosqueState.list&&mosqueState.fromCoords){
    const d=distMeters(co.lat,co.lng,mosqueState.fromCoords.lat,mosqueState.fromCoords.lng);
    if(d<50)return;
  }
  mosqueState={loading:true,error:false,list:null,fromCoords:co};renderMosqueCard();
  // Overpass: 1.8km yarıçapta camiler + mescitler (genişletilmiş sorgu — küçük mescitler
  // çoğu zaman religion=muslim etiketi taşımıyor, bu yüzden birden fazla eşleşme kalıbı kullanıyoruz)
  const r=1800;
  const q=`[out:json][timeout:20];(
    node["amenity"="place_of_worship"]["religion"="muslim"](around:${r},${co.lat},${co.lng});
    way["amenity"="place_of_worship"]["religion"="muslim"](around:${r},${co.lat},${co.lng});
    node["building"="mosque"](around:${r},${co.lat},${co.lng});
    way["building"="mosque"](around:${r},${co.lat},${co.lng});
    node["amenity"="place_of_worship"]["name"~"cami|câmi|mescit|mescid|müftülük",i](around:${r},${co.lat},${co.lng});
    way["amenity"="place_of_worship"]["name"~"cami|câmi|mescit|mescid|müftülük",i](around:${r},${co.lat},${co.lng});
  );out center 80;`;
  const servers=[
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
  ];
  async function trySingle(){
    for(const url of servers){
      try{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),14000);
        const resp=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctrl.signal});
        clearTimeout(tid);
        if(!resp.ok)throw new Error('http '+resp.status);
        const j=await resp.json();
        let arr=(j.elements||[]).map(e=>{
          const la=e.lat||(e.center&&e.center.lat),ln=e.lon||(e.center&&e.center.lon);
          if(!la||!ln)return null;
          const name=(e.tags&&(e.tags.name||e.tags['name:tr']))||'Cami';
          const type=/mescit|mescid/i.test(name)?'mescit':'cami';
          return {name,lat:la,lng:ln,dist:distMeters(co.lat,co.lng,la,ln),type};
        }).filter(Boolean);
        arr.sort((a,b)=>a.dist-b.dist);
        const seen=new Set(),uniq=[];
        for(const m of arr){const key=m.name+'|'+m.lat.toFixed(4);if(seen.has(key))continue;seen.add(key);uniq.push(m);}
        return uniq;
      }catch(e){/* sonraki sunucuyu dene */}
    }
    return null;
  }
  // Sıralama tercihi: en yakın 2 mescit + 1 cami. Mescit yoksa/yetersizse, kalan
  // slotlar en yakın camilerle doldurulur (mescit hiç yoksa sonuç: 3 cami).
  function pickMosqueMix(sorted){
    const mescits=sorted.filter(m=>m.type==='mescit');
    const camiler=sorted.filter(m=>m.type==='cami');
    const mescitCount=Math.min(2,mescits.length);
    let picked=mescits.slice(0,mescitCount);
    picked=picked.concat(camiler.slice(0,3-picked.length));
    if(picked.length<3){
      const used=new Set(picked.map(m=>m.name+'|'+m.lat));
      for(const m of sorted){
        if(picked.length>=3)break;
        const key=m.name+'|'+m.lat;
        if(!used.has(key)){picked.push(m);used.add(key);}
      }
    }
    picked.sort((a,b)=>a.dist-b.dist); // görüntüde en yakından uzağa
    return picked;
  }
  // İlk deneme; hepsi başarısızsa kısa bir bekleme sonrası tek sefer daha dene
  let uniq=await trySingle();
  if(uniq===null){
    await new Promise(res=>setTimeout(res,900));
    uniq=await trySingle();
  }
  if(uniq===null){
    mosqueState={loading:false,error:true,list:null,fromCoords:co};
  }else{
    mosqueState={loading:false,error:uniq.length?false:'empty',list:pickMosqueMix(uniq),fromCoords:co};
  }
  renderMosqueCard();
}
// Haritada yol tarifi aç (telefonun harita uygulaması gerçek yürüme yolunu çizer)
function openDirections(idx){
  const m=mosqueState.list&&mosqueState.list[idx];
  if(!m){toast('Cami bilgisi bulunamadı');return;}
  const url=`https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking`;
  try{
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){
    location.href=url;
  }
}

function mosqueCardHTML(){
  const st=mosqueState;
  let inner='';
  if(st.error==='noloc'){
    inner=`<div class="mq-empty">📍 Yakın camileri görmek için konum gerekli.<br><button class="btn btn-g" style="width:auto;padding:8px 16px;margin-top:8px;font-size:13px" onclick="reqMosqueLoc()">Konumu Aç</button></div>`;
  } else if(st.loading){
    inner=`<div class="mq-empty"><div class="spinner"></div><div style="margin-top:10px;font-size:13px;color:var(--tl)">Yakın camiler aranıyor…</div></div>`;
  } else if(st.error==='empty'){
    inner=`<div class="mq-empty">Yakında (1.8 km) cami/mescit bulunamadı.</div>`;
  } else if(st.error){
    inner=`<div class="mq-empty">Camiler yüklenemedi.<br><button class="btn btn-g" style="width:auto;padding:8px 16px;margin-top:8px;font-size:13px" onclick="findMosques(true)">Tekrar Dene</button></div>`;
  } else if(st.list&&st.list.length){
    inner=st.list.map((m,i)=>`<div class="mq-item" onclick="openDirections(${i})">
      <div class="mq-rank">${i+1}</div>
      <div class="mq-info"><div class="mq-name">${m.name}</div><div class="mq-sub">${m.type==='mescit'?'🕌 Mescit':'🕌 Cami'} · 🚶 ${walkMin(m.dist)} dk · ${fmtDist(m.dist)}</div></div>
      <div class="mq-go">🧭</div>
    </div>`).join('');
  }
  return `<div class="card-hdr" style="margin-bottom:10px"><div class="card-title"><span class="mq-title-ico">${MOSQUE_SVG}</span>Yakındaki Camiler</div>${st.list?`<button class="mq-refresh" onclick="findMosques(true)" aria-label="Camileri yenile">🔄</button>`:''}</div>${inner}`;
}
async function reqMosqueLoc(){
  toast('📍 Konum alınıyor...');
  try{
    const co=await getPosition();
    S.coords=co;save();
    findMosques(true);
  }catch(e){
    toast(e.code===1?'Konum izni verilmedi':'Konum alınamadı');
  }
}
let qiblaHeading=0;      // ham cihaz yönü (derece)
let qiblaSmooth=null;    // yumuşatılmış yön (derece)
let qiblaTarget=0;       // kıble açısı (derece)
let qiblaActive=false;
let qiblaHandler=null;
let qiblaRAF=null;
let qiblaUsingAbsolute=false;

function handleOrientation(e){
  let h=null;
  // iOS: webkitCompassHeading doğrudan kuzeyden derece verir (en güvenilir)
  if(typeof e.webkitCompassHeading==='number' && !isNaN(e.webkitCompassHeading)){
    h=e.webkitCompassHeading;
    // iOS sensör doğruluğu (düşükse kalibrasyon uyar)
    if(typeof e.webkitCompassAccuracy==='number' && e.webkitCompassAccuracy>0 && e.webkitCompassAccuracy<=20){
      const st=document.getElementById('qiblaStatus');
      if(st&&e.webkitCompassAccuracy>15)st.innerHTML='⚠️ Pusula sapmalı olabilir — telefonu ∞ şeklinde çevirin';
    }
  } else if(e.alpha!==null && e.alpha!==undefined){
    // Android: absolute event ise alpha gerçek kuzeye göredir
    h=(360-e.alpha)%360;
    // Ekran yönü düzeltmesi (telefon döndürülmüşse)
    const so=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
    if(so)h=(h+so)%360;
  }
  if(h===null||isNaN(h))return;
  qiblaHeading=(h+360)%360;
}

// Dairesel yumuşatma: iki açı arasında en kısa yoldan yaklaş
function smoothAngle(cur,target,factor){
  let d=((target-cur+540)%360)-180; // -180..180 en kısa fark
  return (cur+d*factor+360)%360;
}

// Animasyon döngüsü — sensörden bağımsız, akıcı çizim
function qiblaLoop(){
  if(!qiblaActive)return;
  if(qiblaSmooth===null)qiblaSmooth=qiblaHeading;
  // 0.15 faktör = yumuşak ama tepkili
  qiblaSmooth=smoothAngle(qiblaSmooth,qiblaHeading,0.15);
  drawCompass(qiblaSmooth);
  qiblaRAF=requestAnimationFrame(qiblaLoop);
}

let qiblaWasAligned=false;
function drawCompass(heading){
  const dial=document.getElementById('compassDial');
  if(dial)dial.style.transform=`rotate(${-heading}deg)`;
  const diff=(qiblaTarget-heading+360)%360;
  const needle=document.getElementById('compassQibla');
  if(needle)needle.style.transform=`rotate(${diff}deg)`;
  const deg=document.getElementById('qiblaDeg');
  let rd=Math.round(diff);if(rd>=360)rd=0; // 360°→0° yuvarlama düzeltmesi
  if(deg)deg.textContent=rd+'°';
  const aligned=diff<6||diff>354;
  const hint=document.getElementById('qiblaHint');
  if(hint){hint.textContent=aligned?'✅ Kıble bulundu — bu yöne dönün':'🕋 işaretini ▲ üst noktaya getirin';hint.style.color=aligned?'#3d7a35':'';hint.style.fontWeight=aligned?'800':'';}
  const ring=document.getElementById('compassRing');
  if(ring){ring.style.borderColor=aligned?'#3d7a35':'';ring.style.borderWidth=aligned?'5px':'3px';}
  // Hizaya İLK girişte titreşim + bildirim (tekrar tekrar değil)
  if(aligned&&!qiblaWasAligned){
    qiblaWasAligned=true;
    if(navigator.vibrate)navigator.vibrate([60,40,60]);
    toast('🕋 Kıble bulundu! '+Math.round(qiblaTarget)+'° yönündesiniz');
  } else if(!aligned&&qiblaWasAligned){
    qiblaWasAligned=false; // hizadan çıktı, sonraki hizalanmada tekrar bildir
  }
}
function updateCompassUI(){drawCompass(qiblaSmooth===null?qiblaHeading:qiblaSmooth);}
async function startCompass(){
  const co=activeCoords();
  qiblaTarget=qiblaBearing(co.lat,co.lng);
  qiblaWasAligned=false;
  const td=document.getElementById('qiblaTargetDeg');if(td)td.textContent=Math.round(qiblaTarget)+'°';
  const st=document.getElementById('qiblaStatus');
  // iOS 13+ izin ister
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      const perm=await DeviceOrientationEvent.requestPermission();
      if(perm!=='granted'){if(st)st.textContent='⚠️ Pusula izni verilmedi';toast('Pusula izni verilmedi');return;}
    }catch(e){if(st)st.textContent='⚠️ Pusula başlatılamadı';return;}
  }
  qiblaHandler=handleOrientation;
  // Önce absolute (gerçek kuzey) dene; varsa ona kilitlen, yoksa normal event
  if('ondeviceorientationabsolute' in window){
    qiblaUsingAbsolute=true;
    window.addEventListener('deviceorientationabsolute',qiblaHandler,true);
    if(st)st.textContent='🧭 Gerçek kuzey (hassas)';
  } else {
    window.addEventListener('deviceorientation',qiblaHandler,true);
    if(st)st.textContent='🧭 Pusula aktif';
  }
  qiblaActive=true;
  qiblaSmooth=null;
  if(qiblaRAF)cancelAnimationFrame(qiblaRAF);
  qiblaLoop();
}
function stopCompass(){
  if(qiblaHandler){
    window.removeEventListener('deviceorientationabsolute',qiblaHandler,true);
    window.removeEventListener('deviceorientation',qiblaHandler,true);
    qiblaHandler=null;
  }
  qiblaActive=false;
  if(qiblaRAF){cancelAnimationFrame(qiblaRAF);qiblaRAF=null;}
  qiblaSmooth=null;
}
