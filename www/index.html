// Native bildirim izni (APK'da otomatik ister)
// Bildirim sesi seçenekleri — her biri ayrı Android kanalı (Android'de kanal
// oluşturulunca ses kilitlenir, bu yüzden değiştirmek için değil, SEÇMEK için 3 ayrı kanal var)
const NOTIF_SOUNDS=[
  {id:'ezan_kisa',label:'Kısa Ezan',file:'ezan_kisa'},
  {id:'bildirim_uzun',label:'Uzun Bildirim Sesi',file:'bildirim_uzun'},
  {id:'bildirim_kisa',label:'Kısa Bildirim Sesi',file:'bildirim_kisa'},
];
async function initNativeNotifications(){
  if(!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications))return;
  try{
    const LN=window.Capacitor.Plugins.LocalNotifications;
    const perm=await LN.checkPermissions();
    if(perm.display!=='granted')await LN.requestPermissions();
    // Her ses seçeneği için ayrı kanal (Android: kanal sesi ilk oluşturmada kilitlenir)
    if(LN.createChannel){
      for(const s of NOTIF_SOUNDS){
        try{await LN.createChannel({id:'vakit_'+s.id,name:'Namaz Vakti — '+s.label,description:'Namaz vakti girince bildirim ve ses',importance:5,visibility:1,vibration:true,sound:s.file});}catch(e){}
      }
    }
  }catch(e){}
}
initNativeNotifications();

// ═══════════════════════════════════════════
//  GERÇEK ZAMANLI BİLDİRİM PLANLAMA
//  Uygulama kapalıyken de vakit girince bildirim gelsin diye,
//  vakitler her güncellendiğinde bugün+yarının tüm bildirimlerini
//  Android'in kendi zamanlayıcısına (native alarm) önceden kaydediyoruz.
// ═══════════════════════════════════════════
async function scheduleAllPrayerNotifications(){
  const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(!LN)return; // web sürümünde bu native özellik yok, sessizce geç
  if(!S.remind)return; // kullanıcı hatırlatıcıyı kapattıysa hiç planlama
  try{
    const perm=await LN.checkPermissions();
    if(perm.display!=='granted'){
      const r=await LN.requestPermissions();
      if(r.display!=='granted')return;
    }
    // Önce eski planlanmış bildirimleri temizle (vakitler değiştiyse çakışmasın/eskimesin)
    try{
      const pending=await LN.getPending();
      if(pending&&pending.notifications&&pending.notifications.length){
        await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
      }
    }catch(e){}

    const now=new Date();
    const notifs=[];
    let id=5000;
    const chId='vakit_'+(S.notifSound||'bildirim_kisa');
    // Bugün kalan vakitler
    for(const p of PR){
      const parts=(S.times[p]||'').split(':').map(Number);
      if(parts.length<2||isNaN(parts[0]))continue;
      const at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parts[0],parts[1],0,0);
      if(at.getTime()>now.getTime()+5000){
        notifs.push({title:'VakitNamaz',body:PI[p]+' '+PN[p]+' vakti girdi',id:id++,channelId:chId,schedule:{at},smallIcon:'ic_stat_icon'});
      }
    }
    // Yarının vakitleri de baştan planlansın (uygulama yarın açılmasa bile bildirimler gelsin diye)
    const tmr=new Date(now); tmr.setDate(tmr.getDate()+1);
    for(const p of PR){
      const parts=(S.times[p]||'').split(':').map(Number);
      if(parts.length<2||isNaN(parts[0]))continue;
      const at=new Date(tmr.getFullYear(),tmr.getMonth(),tmr.getDate(),parts[0],parts[1],0,0);
      notifs.push({title:'VakitNamaz',body:PI[p]+' '+PN[p]+' vakti girdi',id:id++,channelId:chId,schedule:{at},smallIcon:'ic_stat_icon'});
    }
    if(notifs.length)await LN.schedule({notifications:notifs});
  }catch(e){/* sessizce geç, uygulama açıkken zaten checkReminder() yedek olarak çalışıyor */}
}
// Açılışta mevcut vakitlerle bir kez planla (fetchTimes başarılı olduğunda da tekrar planlanıyor)
scheduleAllPrayerNotifications();
async function cancelAllPrayerNotifications(){
  const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(!LN)return;
  try{
    const pending=await LN.getPending();
    if(pending&&pending.notifications&&pending.notifications.length){
      await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
    }
  }catch(e){}
}

let _backPressedOnce=false;
function setupBackButton(){
  const AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!AppPlugin)return;
  AppPlugin.addListener('backButton',()=>{
    const modal=document.getElementById('mov');
    if(modal&&modal.classList.contains('open')){
      closeModForce();
      return;
    }
    // Ekranda görünür bir "←" geri butonu varsa onu tıklat — sure okuma, ibadet
    // akışı, dua ekranı gibi her alt ekran zaten doğru üst adımı biliyor
    // (örn. sure okuyucu → Kur'an listesi, dua → sure akışı, vb.)
    const backBtn=document.querySelector('.back-btn');
    if(backBtn){backBtn.click();return;}
    if(S.screen!=='home'){
      nav('home');
      return;
    }
    if(_backPressedOnce){
      AppPlugin.exitApp();
    }else{
      _backPressedOnce=true;
      toast('Çıkmak için tekrar geri tuşuna basın');
      setTimeout(()=>{_backPressedOnce=false;},2000);
    }
  });
}
