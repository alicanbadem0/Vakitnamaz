<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems https://maps.mail.ru; frame-src 'none'; object-src 'none'; base-uri 'self';">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VakitNamaz">
<title>VakitNamaz</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════
   NİYET · EDITORIAL — Cesur, Ferah, Mimari
   Floating ada menü · Dev kahraman kart · Akan widget
   ════════════════════════════════════════════ */
:root{
  --g1:#0a3d3a;--g2:#0f766e;--g3:#14938a;--g4:#2dd4bf;--gp:#a7f0e8;
  --cr:#f4f6f5;--cm:#e2eae8;--cd:#ecf2f0;
  --go:#c98a2e;--gl:#e6b85a;
  --wh:#ffffff;--td:#0a1f1d;--tm:#3a5350;--tl:#7d9591;
  --ink:#0a1f1d;
  --sh:0 8px 30px rgba(10,61,58,.08);--shx:0 16px 50px rgba(10,61,58,.18);
  --r:24px;--rs:16px;
  --fscale:1;
  --serif:'Amiri',serif;
}
body.dark{
  --cr:#060d0c;--cm:#22322f;--cd:#16241f;
  --wh:#132220;--td:#eef6f4;--tm:#b5cfc9;--tl:#8aa39d;--ink:#eef6f4;
  --gp:#2a5450;--gl:#f0c766;--g4:#3fe0cb;
  --sh:0 6px 24px rgba(0,0,0,.45);--shx:0 14px 44px rgba(0,0,0,.55);
}
body.dark #app{background:radial-gradient(ellipse 120% 40% at 50% 0%,rgba(15,118,110,.16),transparent 60%),var(--cr)}
body.dark .card,body.dark .set-card,body.dark .cal-info,body.dark .cal-d,body.dark .sure-item,body.dark .zl-item,body.dark .zikir-sayac,body.dark .ayet,body.dark .mq-widget,body.dark .snd-pick,body.dark .z-empty,body.dark .z-empty2,body.dark .cd-date,body.dark .ed-loc,body.dark .vstrip,body.dark .zk-fab-inner,body.dark .zk-tap-zone{background:#132220;border-color:#22322f}
body.dark .cal-d.empty{background:transparent;border-color:transparent}
body.dark .sel,body.dark .ksearch,body.dark input[type=text],body.dark input[type=number],body.dark textarea{background:#132220;color:var(--td);border-color:#22322f}
body.dark .compass-ring{background:radial-gradient(circle at 50% 40%,#173028,#0c1a17)}
body.dark #nav{background:#0e1b19;border-top-color:#22322f;box-shadow:0 -1px 0 rgba(63,224,203,.14),0 -8px 28px rgba(0,0,0,.4)}
body.dark .modal-sh{background:#132220}
body.dark .dua-list-item,body.dark .dua-inptarea,body.dark .std-inp,body.dark .font-btn,body.dark .seg,body.dark .z-quick{background:#16241f;color:var(--td)}
body.dark .sec-hdr{background:#132220}
body.dark .hero,body.dark .act-card,body.dark .dh-card,body.dark .continue-card{box-shadow:0 0 0 1px rgba(63,224,203,.18),0 10px 30px rgba(0,0,0,.5)}
body.dark .ker-banner{box-shadow:0 0 0 1px rgba(255,180,80,.2),0 8px 22px rgba(0,0,0,.45)}
/* Koyu temada gradyanlı kartlara ince yıldız serpintisi — gece hissi */
body.dark .act-card::before,body.dark .dh-card::before,body.dark .hdr-c::before,body.dark .continue-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 15% 25%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 38% 65%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.2px 1.2px at 62% 20%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 80% 55%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.3px 1.3px at 92% 30%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 25% 85%,rgba(255,255,255,.3),transparent);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none;background:none;border:none;color:inherit}
button{cursor:pointer}
html,body{height:100%;background:var(--cr);font-family:'Nunito',sans-serif;color:var(--td);overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
#sc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:78px}
#sc::-webkit-scrollbar{display:none}

/* ══ ALT NAVİGASYON (belirgin) ══ */
#nav{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:stretch;background:var(--wh);border-top:1px solid var(--cm);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:200;box-shadow:0 -6px 24px rgba(10,61,58,.09)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;color:var(--tl);border-radius:16px;transition:all .2s;padding:7px 2px}
.nb .ni{font-size:25px;line-height:1;transition:transform .2s;filter:grayscale(.55) opacity(.72)}
.mq-ni{display:inline-flex}
.mq-ni svg{width:23px;height:23px;display:block}
.mq-title-ico{display:inline-flex;vertical-align:-3px;margin-right:6px}
.mq-title-ico svg{width:17px;height:17px;color:var(--g2)}
.pin-ico{display:inline-flex;vertical-align:-2px;margin-right:5px}
.pin-ico svg{width:13px;height:13px}
.nb .nl{font-size:10.5px;letter-spacing:-.1px}
.nb.on{color:var(--g2);background:var(--cd)}
.nb.on .ni{transform:scale(1.14) translateY(-1px);filter:none}
.nb.on .nl{color:var(--g2);font-weight:800}
.nb:active{background:var(--cm)}
.nb-main{background:none;color:var(--tl)}
.nb-main .ni{font-size:25px}
.nb-main.on{color:var(--g2);background:var(--cd)}

/* ══ ANA SAYFA — DEV SAYAÇ (Diyanet tarzı) ══ */
.ed-top{display:flex;align-items:flex-start;justify-content:space-between;padding:36px 20px 0}
.ed-city{font-size:22px;font-weight:800;color:var(--td);letter-spacing:-.5px;line-height:1.1}
.ed-sub{font-size:12px;color:var(--tl);font-weight:700;margin-top:2px}
.ed-loc{background:var(--wh);border:1px solid var(--cm);border-radius:99px;padding:8px 13px;font-family:'Nunito',sans-serif;font-size:11.5px;font-weight:800;color:var(--g2);cursor:pointer;box-shadow:var(--sh);flex-shrink:0}

/* DEV GERİ SAYIM */
.cd-wrap{text-align:center;padding:16px 16px 0}
.cd-lbl{font-size:12.5px;font-weight:800;color:var(--tl);letter-spacing:1.5px;margin-bottom:6px}
.cd-next{font-size:15px;font-weight:800;color:var(--g2);margin-bottom:10px}
.cd-big{font-family:'Space Grotesk',sans-serif;font-size:66px;font-weight:700;color:var(--td);line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;gap:1px}
.cd-sec{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:var(--tl);letter-spacing:-1px}
.cd-date{display:inline-flex;align-items:center;gap:10px;margin-top:10px;background:var(--wh);border:1px solid var(--cm);border-radius:99px;padding:7px 16px;box-shadow:var(--sh)}
.cd-date-txt{font-size:12.5px;font-weight:800;color:var(--td)}
.cd-prog{display:flex;align-items:center;gap:7px;padding-left:11px;border-left:1px solid var(--cm)}
.cd-prog-bar{width:52px;height:5px;border-radius:99px;background:var(--cm);overflow:hidden}
.cd-prog-fill{height:100%;border-radius:99px;background:var(--g3);transition:width .4s}
.cd-prog-txt{font-size:11.5px;font-weight:800;color:var(--g2)}

/* VAKİT ŞERİDİ (yatay) */
.vstrip{display:flex;gap:2px;margin:14px 12px 0;background:var(--wh);border:1px solid var(--cm);border-radius:18px;padding:8px 6px;box-shadow:var(--sh)}
.vs{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;transition:background .2s;position:relative}
.vs-nm{font-size:10.5px;font-weight:800;color:var(--tl);letter-spacing:-.2px}
.vs-tm{font-size:13.5px;font-weight:800;color:var(--td);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.vs.on{background:var(--g2)}
.vs.on .vs-nm{color:rgba(255,255,255,.85)}
.vs.on .vs-tm{color:#fff}
.vs.done::after{content:'✓';position:absolute;top:2px;right:5px;font-size:9px;color:var(--g4);font-weight:800}
.vs.past .vs-nm,.vs.past .vs-tm{opacity:.45}
.vs-ig{opacity:.55;background:transparent!important}
.vs-ig .vs-nm{font-size:9.5px}
.vs-ig .vs-tm{font-size:12px}

/* KERAHAT VAKTİ UYARISI */
.ker-banner{display:flex;align-items:center;gap:11px;margin:12px 16px 0;background:linear-gradient(135deg,#8a5a1a,#b8791f);border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(138,90,26,.28)}
.ker-ico{font-size:22px;flex-shrink:0}
.ker-body{flex:1;min-width:0}
.ker-lbl{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#ffe9c2}
.ker-desc{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px;line-height:1.4}
.ker-cd{font-size:14px;font-weight:800;color:#fff;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:10px;flex-shrink:0;white-space:nowrap}

/* AKTİF VAKİT İBADET KARTI (tek kart) */
.act-card{margin:12px 16px 0;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:22px;padding:14px 16px;cursor:pointer;box-shadow:0 8px 24px rgba(15,118,110,.28);position:relative;overflow:hidden}
.act-motif{position:absolute;right:-22px;bottom:-20px;width:120px;height:120px;opacity:.12;pointer-events:none}
.act-in{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.act-ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.act-body{flex:1;min-width:0}
.act-lbl{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:var(--g4);margin-bottom:3px}
.act-name{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.3px}
.act-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-go{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800;flex-shrink:0}
.act-done{background:linear-gradient(135deg,#1e4d3f,#276b52)}
.act-done .act-go{background:rgba(255,255,255,.28)}


/* GÜNÜN HADİSİ */
.dh-card{margin:12px 16px 0;background:linear-gradient(140deg,var(--g1),var(--g2));border-radius:20px;padding:14px 16px 13px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(10,61,58,.2)}
.dh-card::before{content:'\275D';position:absolute;top:6px;left:12px;font-size:56px;color:rgba(255,255,255,.08);font-family:serif;line-height:1}
.dh-lbl{position:relative;font-size:9.5px;font-weight:800;letter-spacing:1.8px;color:var(--g4);margin-bottom:8px}
.dh-txt{position:relative;font-size:13px;line-height:1.55;color:#fff;font-style:italic;font-weight:600}
.dh-src{position:relative;font-size:10.5px;color:rgba(255,255,255,.62);margin-top:6px;font-weight:700}

/* CAMİ WIDGET */
.mq-widget{margin:12px 16px 0;background:var(--wh);border:1px solid var(--cm);border-radius:18px;padding:12px 15px;box-shadow:var(--sh)}

/* ══ DİĞER EKRAN BAŞLIKLARI (editorial hdr) ══ */
.hdr{padding:44px 20px 14px;background:transparent;position:relative}
.hdr-c{padding:44px 20px 18px;background:linear-gradient(135deg,var(--g1),var(--g2));position:relative;box-shadow:0 4px 24px rgba(10,61,58,.18)}
.hbism{font-family:var(--serif);font-size:16px;color:var(--g2);text-align:left;margin-bottom:4px;opacity:.9}
.htitle{font-size:25px;font-weight:800;color:var(--td);text-align:left;letter-spacing:-.7px;line-height:1.05}
.hdate{font-size:12.5px;color:var(--tl);text-align:left;margin-top:4px;font-weight:700}

/* CARDS (genel) */
.card{background:var(--wh);border:1px solid var(--cm);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin:0 18px 12px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:15px;font-weight:800;color:var(--td)}
.prog-pct{font-size:22px;font-weight:800;color:var(--g2)}
.prog-bg{background:var(--cm);border-radius:99px;height:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--g4));transition:width .7s cubic-bezier(.4,0,.2,1)}
.stitle{font-size:12px;font-weight:800;color:var(--tl);text-transform:uppercase;letter-spacing:2px;padding:18px 22px 10px}

/* BUTTONS */
.btn{width:100%;padding:16px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;transition:all .2s}
.btn:active{transform:scale(.98)}
.btn-g{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;box-shadow:0 8px 22px rgba(15,118,110,.3)}
.btn-o{background:transparent;border:2px solid var(--g2);color:var(--g2);margin-top:10px}
.btn-gold{background:linear-gradient(135deg,var(--go),var(--gl));color:#fff;margin-top:10px}

/* FLOW */
.flow-pad{padding:18px 18px 120px}
.hadis-card{background:linear-gradient(150deg,var(--g1),var(--g2));border-radius:var(--r);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.hadis-card::before{content:'❝';position:absolute;top:10px;left:14px;font-size:64px;color:rgba(255,255,255,.07);font-family:serif;line-height:1}
.h-lbl{font-size:11px;font-weight:800;color:var(--g4);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.h-txt{font-family:var(--serif);font-size:19px;line-height:1.85;color:#fff;margin-bottom:14px}
.h-src{font-size:11px;color:rgba(255,255,255,.55);font-style:italic}

.besmele{background:var(--cd);border:1px solid var(--cm);border-radius:var(--rs);padding:14px;margin-bottom:11px;text-align:center}
.besmele-ar{font-family:var(--serif);font-size:26px;color:var(--g2);direction:rtl;line-height:1.6}
.besmele-tr{font-size:12px;color:var(--tm);margin-top:4px;font-style:italic}
.ayet{background:var(--wh);border:1px solid var(--cm);border-radius:var(--rs);padding:16px 18px;margin-bottom:10px;box-shadow:var(--sh);transition:background .5s,box-shadow .5s}
.ayet-highlight{background:var(--gp)!important;box-shadow:0 0 0 2px var(--g3) inset}
.continue-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:16px;padding:13px 15px;margin-bottom:12px;cursor:pointer;box-shadow:0 6px 18px rgba(15,118,110,.28)}
.cc-ico{font-size:22px;flex-shrink:0}
.cc-body{flex:1;min-width:0}
.cc-lbl{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--g4)}
.cc-name{font-size:14px;font-weight:800;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-go{font-size:18px;color:#fff;font-weight:800;flex-shrink:0}
.ayet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ayet-no{font-size:11px;font-weight:800;color:var(--g2)}
.ayet-bm{background:none;border:none;cursor:pointer;font-size:18px;color:var(--tl)}
.ayet-bm.on{color:var(--go)}
.ayet-ar{font-family:var(--serif);font-size:calc(23px * var(--fscale));line-height:2.15;color:var(--td);direction:rtl;text-align:right;margin-bottom:8px;border-bottom:1px dashed var(--cm);padding-bottom:8px}
.ayet-tr{font-family:var(--serif);font-size:calc(17px * var(--fscale));line-height:1.9;color:var(--td)}
.lang-tog{display:flex;background:rgba(255,255,255,.15);border-radius:99px;padding:3px;margin-top:10px}
.disp-tog{display:flex;background:rgba(255,255,255,.15);border-radius:99px;padding:3px;margin-top:10px;gap:3px}
.dt-btn{flex:1;padding:7px 4px;border:none;border-radius:99px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;background:transparent;color:rgba(255,255,255,.65)}
.dt-btn.on{background:#fff;color:var(--g1)}
.ayet-meal{font-family:'Nunito',sans-serif;font-size:calc(14px * var(--fscale));line-height:1.7;color:var(--g2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--cm)}
.spinner{width:34px;height:34px;border:3px solid var(--cm);border-top-color:var(--g2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

.dua-vakit-card{background:linear-gradient(150deg,#0a3d3a,#0e5f63);border-radius:var(--r);padding:24px;margin-bottom:14px;position:relative;overflow:hidden}
.dua-vakit-card::before{content:'🤲';position:absolute;top:12px;right:16px;font-size:40px;opacity:.13}
.dv-lbl{font-size:11px;font-weight:800;color:var(--g4);text-transform:uppercase;letter-spacing:2px;margin-bottom:9px}
.dv-bism{font-family:var(--serif);font-size:20px;color:#fff;direction:rtl;text-align:center;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.dv-txt{font-size:14px;line-height:1.9;color:#ddf0ed;font-style:italic}

/* ZİKİR */
.z-listhdr{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.z-listttl{font-size:12px;font-weight:800;color:var(--tl);letter-spacing:1px}
.z-add-btn{background:var(--g2);color:#fff;border:none;border-radius:99px;padding:8px 15px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px rgba(15,118,110,.28)}
.z-add-btn:active{transform:scale(.96)}
.z-empty2{background:var(--wh);border:1px dashed var(--cm);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--tl);font-size:13.5px;line-height:1.6}
.z-quickrow{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.z-quick{background:var(--cd);border:1px solid var(--cm);border-radius:99px;padding:7px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;color:var(--g2);cursor:pointer}
.z-quick:active{background:var(--gp)}
/* ══ ZİKİR — BAŞPARMAK BÖLGESİ SABİT SAYAÇ (alt bar) ══ */
.zk-fab-bar{position:fixed;left:0;right:0;bottom:78px;z-index:150;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.zk-fab-inner{pointer-events:auto;width:100%;max-width:440px;background:var(--wh);border:1px solid var(--cm);border-radius:28px;padding:12px 18px 14px;box-shadow:0 -8px 28px rgba(10,61,58,.16),0 6px 20px rgba(10,61,58,.1);display:flex;flex-direction:column;align-items:center;gap:2px}
.zk-fab-ar{font-family:var(--serif);font-size:15px;color:var(--g2);direction:rtl;text-align:center;line-height:1.3}
.zk-fab-name{font-size:12.5px;font-weight:800;color:var(--tl);text-align:center;letter-spacing:.2px}
.zk-circle-wrap{position:relative;width:128px;height:128px;margin:6px 0 4px;border-radius:50%;background:conic-gradient(var(--g3) calc(var(--p,0)*1%),var(--cm) 0);transition:background .25s}
.zk-tap-zone{position:absolute;inset:7px;border-radius:50%;background:var(--wh);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.zk-tap-zone:active{background:var(--cd)}
.zk-count{font-size:40px;font-weight:800;color:var(--td);line-height:1;font-variant-numeric:tabular-nums}
.zk-count.ck{animation:zkpop .3s}
@keyframes zkpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.zk-remain{font-size:11px;color:var(--tl);font-weight:700;margin-top:2px}

// ══════════════════════════════════════════════
//  KURAN API · Çek-ve-sakla (cache-first)
//  Kaynak: AlQuran.cloud · Diyanet meali + Türkçe okunuş
// ══════════════════════════════════════════════
const QURAN_API='https://api.alquran.cloud/v1';
const QED_AR='quran-uthmani';      // Arapça (Osmanlı hattı)
const QED_TR='tr.transliteration'; // Türkçe okunuş
const QED_MEAL='tr.diyanet';       // Diyanet İşleri meali
const QCACHE_PREFIX='niyet_sure_'; // localStorage anahtarı

// Bir sureyi cache'ten al; yoksa API'den çek ve sakla.
// Döner: {no, name, ayets:[{no,ar,tr,meal}]} veya null (hata)
async function getSurah(no){
  // 1) Cache'e bak
  try{
    const c=localStorage.getItem(QCACHE_PREFIX+no);
    if(c){const d=JSON.parse(c);if(d&&d.ayets&&d.ayets.length)return d;}
  }catch(e){}
  // 2) API'den çek (3 baskı tek istekte)
  try{
    const url=`${QURAN_API}/surah/${no}/editions/${QED_AR},${QED_TR},${QED_MEAL}`;
    const r=await fetch(url);
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    if(j.code!==200||!j.data||!j.data.length)throw new Error('bad data');
    const arE=j.data.find(e=>e.edition.identifier===QED_AR)||j.data[0];
    const trE=j.data.find(e=>e.edition.identifier===QED_TR);
    const mealE=j.data.find(e=>e.edition.identifier===QED_MEAL);
    const ayets=arE.ayahs.map((a,i)=>({
      no:a.numberInSurah,
      ar:a.text,
      tr:trE&&trE.ayahs[i]?trE.ayahs[i].text:'',
      meal:mealE&&mealE.ayahs[i]?mealE.ayahs[i].text:''
    }));
    const data={no,name:arE.englishName||('Sure '+no),nameAr:arE.name||'',ayets};
    // 3) Sakla
    try{localStorage.setItem(QCACHE_PREFIX+no,JSON.stringify(data));}catch(e){}
    return data;
  }catch(e){return null;}
}
// Sure cache'te var mı? (indirilmiş mi)
function isSurahCached(no){try{return !!localStorage.getItem(QCACHE_PREFIX+no);}catch(e){return false;}}

    {no:15,ar:"لِّنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا",tr:"Li nuhrice bihî habben ve nebâtâ."},
    {no:16,ar:"وَجَنَّاتٍ أَلْفَافًا",tr:"Ve cennâtin elfâfâ."},
    {no:17,ar:"إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا",tr:"İnne yevmel fasli kâne mîkâtâ."},
    {no:18,ar:"يَوْمَ يُنفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا",tr:"Yevme yünfahu fis sûri fe te'tûne efvâcâ."},
    {no:19,ar:"وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا",tr:"Ve fütihetis semâü fekânet ebvâbâ."},
    {no:20,ar:"وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا",tr:"Ve süyyiretil cibâlü fekânet serâbâ."},
    {no:21,ar:"إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا",tr:"İnne cehenneme kânet mirsâdâ."},
    {no:22,ar:"لِّلطَّاغِينَ مَآبًا",tr:"Lit tâğîne meâbâ."},
    {no:23,ar:"لَّابِثِينَ فِيهَا أَحْقَابًا",tr:"Lâbisîne fîhâ ahkâbâ."},
    {no:24,ar:"لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا",tr:"Lâ yezûkûne fîhâ berden ve lâ şerâbâ."},
    {no:25,ar:"إِلَّا حَمِيمًا وَغَسَّاقًا",tr:"İllâ hamîmen ve ğassâkâ."},
    {no:26,ar:"جَزَاءً وِفَاقًا",tr:"Cezâen vifâkâ."},
    {no:27,ar:"إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا",tr:"İnnehüm kânû lâ yercûne hisâbâ."},
    {no:28,ar:"وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا",tr:"Ve kezzebû biâyâtinâ kizzâbâ."},
    {no:29,ar:"وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا",tr:"Ve külle şey'in ahsaynâhü kitâbâ."},
    {no:30,ar:"فَذُوقُوا فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا",tr:"Fezûkû felen nezîdeküm illâ azâbâ."},
    {no:31,ar:"إِنَّ لِلْمُتَّقِينَ مَفَازًا",tr:"İnne lil müttekîne mefâzâ."},
    {no:32,ar:"حَدَائِقَ وَأَعْنَابًا",tr:"Hadâika ve a'nâbâ."},
    {no:33,ar:"وَكَوَاعِبَ أَتْرَابًا",tr:"Ve kevâibe etrâbâ."},
    {no:34,ar:"وَكَأْسًا دِهَاقًا",tr:"Ve ke'sen dihâkâ."},
    {no:35,ar:"لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا",tr:"Lâ yesme'ûne fîhâ lağven ve lâ kizzâbâ."},
    {no:36,ar:"جَزَاءً مِّن رَّبِّكَ عَطَاءً حِسَابًا",tr:"Cezâen min rabbike atâen hisâbâ."},
    {no:37,ar:"رَّبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ",tr:"Rabbis semâvâti vel ardı ve mâ beynehumar rahmân, lâ yemlikûne minhü hitâbâ."},
    {no:38,ar:"يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا لَّا يَتَكَلَّمُونَ",tr:"Yevme yekûmür rûhu vel melâiketü saffan lâ yetekellemûne illâ men ezine lehür rahmânü ve kâle savâbâ."},
    {no:39,ar:"ذَٰلِكَ الْيَوْمُ الْحَقُّ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا",tr:"Zâlikel yevmül hakk, femen şâettehaze ilâ rabbihî meâbâ."},
    {no:40,ar:"إِنَّا أَنذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ",tr:"İnnâ enzernâküm azâben karîben yevme yenzurul mer'ü mâ kaddemet yedâhü ve yekûlül kâfiru yâ leytenî küntü türâbâ."},
  ]},  bakara_son2:{name:"Bakara Suresi (Son 2 Ayet)",ayets:[
    {no:285,ar:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ",tr:"Âmenar-resûlü bimâ ünzile ileyhi min rabbihî vel mü'minûn, küllün âmene billâhi ve melâiketihî ve kütübihî ve rusülih, lâ nüferriku beyne ehadin min rusülih, ve kâlû semi'nâ ve eta'nâ gufrâneke rabbenâ ve ileykel masîr."},
    {no:286,ar:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ",tr:"Lâ yükellifullâhü nefsen illâ vüs'ahâ, lehâ mâ kesebet ve aleyhâ mektesebet, rabbenâ lâ tüâhiznâ in nesînâ ev ahta'nâ, rabbenâ ve lâ tühammilnâ mâ lâ tâkate lenâ bih, va'fü annâ vağfir lenâ verhamnâ, ente mevlânâ fensurnâ alel-kavmil-kâfirîn."},
  ]},
  yasin:{name:"Yâsin Suresi",ayets:[
    {no:1,ar:"يس",tr:"Yâ-Sîn."},{no:2,ar:"وَالْقُرْآنِ الْحَكِيمِ",tr:"Vel-Kur'ânil-hakîm."},
    {no:3,ar:"إِنَّكَ لَمِنَ الْمُرْسَلِينَ",tr:"İnneke le-minel-murselîn."},{no:4,ar:"عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ",tr:"Alâ sırâtın mustakîm."},
    {no:5,ar:"تَنزِيلَ الْعَزِيزِ الرَّحِيمِ",tr:"Tenzîlel-azîzir-rahîm."},{no:6,ar:"لِتُنذِرَ قَوْمًا مَّا أُنذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ",tr:"Li-tunzira kavmen mâ unzira âbâuhum fehum gâfilûn."},
    {no:7,ar:"لَقَدْ حَقَّ الْقَوْلُ عَلَىٰ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ",tr:"Lekad hakkal-kavlü alâ ekserihim fehum lâ yu'minûn."},
    {no:8,ar:"إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلَالًا فَهِيَ إِلَى الْأَذْقَانِ فَهُم مُّقْمَحُونَ",tr:"İnnâ cealnâ fî a'nâkihim aglâlen fehiye ilel-ezkâni fehum mukmehûn."},
    {no:9,ar:"وَجَعَلْنَا مِن بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ",tr:"Ve cealnâ min beyni eydîhim sedden ve min halfihim sedden fe-agşeynâhum fehum lâ yubsirûn."},
    {no:10,ar:"وَسَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ",tr:"Ve sevâun aleyhim e-enzertehum em lem tunzirhum lâ yu'minûn."},
    {no:11,ar:"إِنَّمَا تُنذِرُ مَنِ اتَّبَعَ الذِّكْرَ وَخَشِيَ الرَّحْمَٰنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ",tr:"İnnemâ tunziru menittebez-zikra ve haşiyer-rahmâne bil-gayb, fe-beşşirhü bimağfiretin ve ecrin kerîm."},
    {no:12,ar:"إِنَّا نَحْنُ نُحْيِي الْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ",tr:"İnnâ nahnu nuhyil-mevtâ ve nektubu mâ kaddemu ve âsârehum, ve kulle şey'in ahsaynâhu fî imâmin mübîn."},
    {no:13,ar:"وَاضْرِبْ لَهُم مَّثَلًا أَصْحَابَ الْقَرْيَةِ إِذْ جَاءَهَا الْمُرْسَلُونَ",tr:"Vadrib lehum meselen ashâbel-karyeh, iz câehel-murselûn."},
    {no:14,ar:"إِذْ أَرْسَلْنَا إِلَيْهِمُ اثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ",tr:"İz erselna ileyhimüsneyni fe-kezzebûhumâ fe-azzeznâ bisâlisin fe-kâlû innâ ileykum murselûn."},
    {no:15,ar:"قَالُوا مَا أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا",tr:"Kâlû mâ entum illâ beşerun mislunâ ve mâ enzeler-rahmânu min şey'in in entum illâ tekzibûn."},
    {no:16,ar:"قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ",tr:"Kâlû rabbünâ ya'lemu innâ ileykum lemurselûn."},
    {no:17,ar:"وَمَا عَلَيْنَا إِلَّا الْبَلَاغُ الْمُبِينُ",tr:"Ve mâ aleynâ illel-belâğul-mübîn."},
    {no:18,ar:"قَالُوا إِنَّا تَطَيَّرْنَا بِكُمْ ۖ لَئِن لَّمْ تَنتَهُوا لَنَرْجُمَنَّكُمْ",tr:"Kâlû innâ tetayyernâ bikum, le-in lem tentehû le-nercumennekum ve le-yemessennekum minnâ azâbun elîm."},
    {no:19,ar:"قَالُوا طَائِرُكُم مَّعَكُمْ ۚ أَئِن ذُكِّرْتُم ۚ بَلْ أَنتُمْ قَوْمٌ مُّسْرِفُونَ",tr:"Kâlû tâirukum meakum, e-in zukkirtum, bel entum kavmun musrifûn."},
    {no:20,ar:"وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ",tr:"Ve câe min aksal-medîneti raculun yes'â, kâle yâ kavmittebiul-murselîn."},
    {no:21,ar:"اتَّبِعُوا مَن لَّا يَسْأَلُكُمْ أَجْرًا وَهُم مُّهْتَدُونَ",tr:"İttebiu men lâ yes'elukum ecran ve hum muhtedûn."},
    {no:22,ar:"وَمَا لِيَ لَا أَعْبُدُ الَّذِي فَطَرَنِي وَإِلَيْهِ تُرْجَعُونَ",tr:"Ve mâ liye lâ a'budüllezî fetaranî ve ileyhi turce'ûn."},
    {no:23,ar:"أَأَتَّخِذُ مِن دُونِهِ آلِهَةً إِن يُرِدْنِ الرَّحْمَٰنُ بِضُرٍّ",tr:"E-ettehizu min dûnihî âliheten in yuridnir-rahmânü bi-durrin lâ tuğni annî şefâatuhum şey'en ve lâ yunqizûn."},
    {no:24,ar:"إِنِّي إِذًا لَّفِي ضَلَالٍ مُّبِينٍ",tr:"İnnî izen lefî dalâlin mübîn."},
    {no:25,ar:"إِنِّي آمَنتُ بِرَبِّكُمْ فَاسْمَعُونِ",tr:"İnnî âmentü birabbikum fesme'ûn."},
    {no:26,ar:"قِيلَ ادْخُلِ الْجَنَّةَ ۖ قَالَ يَا لَيْتَ قَوْمِي يَعْلَمُونَ",tr:"Kîledhuler-cenneh, kâle yâ leyte kavmî ya'lemûn."},
    {no:27,ar:"بِمَا غَفَرَ لِي رَبِّي وَجَعَلَنِي مِنَ الْمُكْرَمِينَ",tr:"Bimâ gafera lî rabbî ve cealenî minel-mukramîn."},
    {no:28,ar:"وَمَا أَنزَلْنَا عَلَىٰ قَوْمِهِ مِن بَعْدِهِ مِن جُندٍ مِّنَ السَّمَاءِ",tr:"Ve mâ enzelna alâ kavmihî min ba'dihî min cundin mines-semâi ve mâ kunnâ munzilîn."},
    {no:29,ar:"إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ خَامِدُونَ",tr:"İn kânet illâ sayhaten vâhideten fe-izâ hum hâmidûn."},
    {no:30,ar:"يَا حَسْرَةً عَلَى الْعِبَادِ ۚ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ",tr:"Yâ hasraten alel-ibâd, mâ ye'tîhim min resûlin illâ kânû bihî yestehzi'ûn."},
    {no:31,ar:"أَلَمْ يَرَوْا كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ الْقُرُونِ",tr:"Elem yerav kem ehleknâ kablehum minel-kurûni ennehum ileyhim lâ yerci'ûn."},
    {no:32,ar:"وَإِن كُلٌّ لَّمَّا جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ",tr:"Ve in kullun lemmâ cemî'un ledeynâ muhdarûn."},
    {no:33,ar:"وَآيَةٌ لَّهُمُ الْأَرْضُ الْمَيْتَةُ أَحْيَيْنَاهَا وَأَخْرَجْنَا مِنْهَا حَبًّا",tr:"Ve âyetun lehumul-ardul-meyteh, ahyeynâhâ ve ahrecnâ minhâ habben fe-mihu ye'kulûn."},
    {no:34,ar:"وَجَعَلْنَا فِيهَا جَنَّاتٍ مِّن نَّخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ",tr:"Ve cealnâ fîhâ cennâtin min nahîlin ve a'nâbin ve feccernâ fîhâ minel-'uyûn."},
    {no:35,ar:"لِيَأْكُلُوا مِن ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ ۖ أَفَلَا يَشْكُرُونَ",tr:"Li-ye'kulû min semerihî ve mâ amilethu eydîhim, efelâ yeşkurûn."},
    {no:36,ar:"سُبْحَانَ الَّذِي خَلَقَ الْأَزْوَاجَ كُلَّهَا مِمَّا تُنبِتُ الْأَرْضُ وَمِنْ أَنفُسِهِمْ",tr:"Subhânellezî halakal-ezvâce kullehâ mimmâ tunbitül-ardu ve min enfusihim ve mimmâ lâ ya'lemûn."},
    {no:37,ar:"وَآيَةٌ لَّهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُم مُّظْلِمُونَ",tr:"Ve âyetun lehumul-leyl, neslahuminnehâra fe-izâ hum muzlimûn."},
    {no:38,ar:"وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ",tr:"Veş-şemsu tecrî li-müstekarrin lehâ, zâlike taqdîrul-azîzil-alîm."},
    {no:39,ar:"وَالْقَمَرَ قَدَّرْنَاهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ الْقَدِيمِ",tr:"Vel-kamere kaddernâhu menâzile hattâ âde kel-urcûnil-kadîm."},
    {no:40,ar:"لَا الشَّمْسُ يَنبَغِي لَهَا أَن تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سَابِقُ النَّهَارِ ۚ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ",tr:"Leş-şemsu yenbegî lehâ en tudrikal-kamere ve lel-leylu sâbikun-nehâr, ve kullun fî felekin yesbehûn."},
    {no:41,ar:"وَآيَةٌ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِي الْفُلْكِ الْمَشْحُونِ",tr:"Ve âyetun lehum ennâ hamelnâ zurriyyetehum fil-fulkil-meşhûn."},
    {no:42,ar:"وَخَلَقْنَا لَهُم مِّن مِّثْلِهِ مَا يَرْكَبُونَ",tr:"Ve halakna lehum min mislihî mâ yarkebûn."},
    {no:43,ar:"وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ",tr:"Ve in neşe' nugriqhum felâ sarîha lehum ve lâ hum yunqazûn."},
    {no:44,ar:"إِلَّا رَحْمَةً مِّنَّا وَمَتَاعًا إِلَىٰ حِينٍ",tr:"İllâ rahmeten minnâ ve metâan ilâ hîn."},
    {no:45,ar:"وَإِذَا قِيلَ لَهُمُ اتَّقُوا مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ",tr:"Ve izâ kîle lehumuttekû mâ beyne eydîkum ve mâ halfe-kum lealleküm turhamûn."},
    {no:46,ar:"وَمَا تَأْتِيهِم مِّنْ آيَةٍ مِّنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ",tr:"Ve mâ te'tîhim min âyetin min âyâti rabbihim illâ kânû anhâ mu'ridîn."},
    {no:47,ar:"وَإِذَا قِيلَ لَهُمْ أَنفِقُوا مِمَّا رَزَقَكُمُ اللَّهُ",tr:"Ve izâ kîle lehum enfikû mimmâ rezakakumullâhu kâlellezîne keferû lillezîne âmenû e-nut'imu men lev yeşâullâhu at'ameh."},
    {no:48,ar:"وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ",tr:"Ve yekûlûne metâ hâzel-va'du in kuntum sâdikîn."},
    {no:49,ar:"مَا يَنظُرُونَ إِلَّا صَيْحَةً وَاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ",tr:"Mâ yenzurûne illâ sayhaten vâhideten te'huzuhum ve hum yehissimûn."},
    {no:50,ar:"فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَا إِلَىٰ أَهْلِهِمْ يَرْجِعُونَ",tr:"Felâ yestetî'ûne tevsiyeten ve lâ ilâ ehlihim yerci'ûn."},
    {no:51,ar:"وَنُفِخَ فِي الصُّورِ فَإِذَا هُم مِّنَ الْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ",tr:"Ve nufiha fis-sûri fe-izâ hum minel-ecdâsi ilâ rabbihim yensilûn."},
    {no:52,ar:"قَالُوا يَا وَيْلَنَا مَن بَعَثَنَا مِن مَّرْقَدِنَا",tr:"Kâlû yâ veylenâ men be'asenâ min merkadina? Hâzâ mâ ve'ader-rahmânu ve sadekal-murselûn."},
    {no:53,ar:"إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ",tr:"İn kânet illâ sayhaten vâhideten fe-izâ hum cemî'un ledeynâ muhdarûn."},
    {no:54,ar:"فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْئًا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ",tr:"Fel-yevme lâ tuzlemu nefsun şey'en ve lâ tuczevne illâ mâ kuntum ta'melûn."},
    {no:55,ar:"إِنَّ أَصْحَابَ الْجَنَّةِ الْيَوْمَ فِي شُغُلٍ فَاكِهُونَ",tr:"İnne ashâbel-cennetil-yevme fî şuğulin fâkihûn."},
    {no:56,ar:"هُمْ وَأَزْوَاجُهُمْ فِي ظِلَالٍ عَلَى الْأَرَائِكِ مُتَّكِئُونَ",tr:"Hum ve ezvâcuhum fî zılâlin alel-erâikimuttekiûn."},
    {no:57,ar:"لَهُمْ فِيهَا فَاكِهَةٌ وَلَهُم مَّا يَدَّعُونَ",tr:"Lehum fîhâ fâkihetun ve lehum mâ yed-de'ûn."},
    {no:58,ar:"سَلَامٌ قَوْلًا مِّن رَّبٍّ رَّحِيمٍ",tr:"Selâmun kavlen min rabbin rahîm."},
    {no:59,ar:"وَامْتَازُوا الْيَوْمَ أَيُّهَا الْمُجْرِمُونَ",tr:"Vemtâzul-yevme eyyuhel-mucrimûn."},
    {no:60,ar:"أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَن لَّا تَعْبُدُوا الشَّيْطَانَ",tr:"Elem a'had ileykum yâ benî âdeme en lâ ta'budûş-şeytân, innehû lekum aduvvun mübîn."},
    {no:61,ar:"وَأَنِ اعْبُدُونِي ۚ هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ",tr:"Ve enî'budûnî, hâzâ sırâtun mustakîm."},
    {no:62,ar:"وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّا كَثِيرًا ۖ أَفَلَمْ تَكُونُوا تَعْقِلُونَ",tr:"Ve lekad edalle minkum cibillen kesîrâ, efelem tekûnû ta'kilûn."},
    {no:63,ar:"هَٰذِهِ جَهَنَّمُ الَّتِي كُنتُمْ تُوعَدُونَ",tr:"Hâzihî cehennemulletî kuntum tû'adûn."},
    {no:64,ar:"اصْلَوْهَا الْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ",tr:"Islevhel-yevme bimâ kuntum tekfurûn."},
    {no:65,ar:"الْيَوْمَ نَخْتِمُ عَلَىٰ أَفْوَاهِهِمْ وَتُكَلِّمُنَا أَيْدِيهِمْ",tr:"El-yevme nahtimu alâ efvâhihim ve tukellimunâ eydîhim ve teşhedu ercüluhum bimâ kânû yeksibûn."},
    {no:66,ar:"وَلَوْ نَشَاءُ لَطَمَسْنَا عَلَىٰ أَعْيُنِهِمْ",tr:"Ve lev neşâu letamesnâ alâ a'yunihim festebekus-sirâta fe-ennâ yubsirûn."},
    {no:67,ar:"وَلَوْ نَشَاءُ لَمَسَخْنَاهُمْ عَلَىٰ مَكَانَتِهِمْ",tr:"Ve lev neşâu le-mesahnâhum alâ mekânetihim femestetâ'û mudiyyen ve lâ yerci'ûn."},
    {no:68,ar:"وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِي الْخَلْقِ ۖ أَفَلَا يَعْقِلُونَ",tr:"Ve men nu'ammirhu nunakkishu fil-halk, efelâ ya'kilûn."},
    {no:69,ar:"وَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنبَغِي لَهُ ۚ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْآنٌ مُّبِينٌ",tr:"Ve mâ allemnâhuş-şi'ra ve mâ yenbegî leh, in hüve illâ zikrun ve Kur'ânun mübîn."},
    {no:70,ar:"لِّيُنذِرَ مَن كَانَ حَيًّا وَيَحِقَّ الْقَوْلُ عَلَى الْكَافِرِينَ",tr:"Li-yunzira men kâne hayyen ve yahikkal-kavlu alel-kâfirîn."},
    {no:71,ar:"أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَا أَنْعَامًا",tr:"Evelem yerav ennâ halakna lehum mimmâ amilet eydînâ en'âmen fehum lehâ mâlikûn."},
    {no:72,ar:"وَذَلَّلْنَاهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ",tr:"Ve zellelnâhâ lehum feminhâ rekûbuhum ve minhâ ye'kulûn."},
    {no:73,ar:"وَلَهُمْ فِيهَا مَنَافِعُ وَمَشَارِبُ ۖ أَفَلَا يَشْكُرُونَ",tr:"Ve lehum fîhâ menâfi'u ve meşârib, efelâ yeşkurûn."},
    {no:74,ar:"وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لَّعَلَّهُمْ يُنصَرُونَ",tr:"Vettehazû min dûnillâhi âliheten leallehem yunsarûn."},
    {no:75,ar:"لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌ مُّحْضَرُونَ",tr:"Lâ yestetî'ûne nasrahum ve hum lehum cundum muhdarûn."},
    {no:76,ar:"فَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ",tr:"Felâ yahzunke kavluhum, innâ na'lemu mâ yusirrûne ve mâ yu'linûn."},
    {no:77,ar:"أَوَلَمْ يَرَ الْإِنسَانُ أَنَّا خَلَقْنَاهُ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ",tr:"Evelem yerel-insânu ennâ halaknahum min nutfetin fe-izâ hüve hasîmun mübîn."},
    {no:78,ar:"وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ",tr:"Ve darebe lenâ meselen ve nesiye halkahu, kâle men yuhyil-izâme ve hiye ramîm."},
    {no:79,ar:"قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ",tr:"Kul yuhyîhellezî enşeehâ evvele merretin ve hüve bikülli halkin alîm."},
    {no:80,ar:"الَّذِي جَعَلَ لَكُم مِّنَ الشَّجَرِ الْأَخْضَرِ نَارًا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ",tr:"Ellezî ce'ale lekum mineş-şeceril-ahdari nâran fe-izâ entum mihnü tûkidûn."},
    {no:81,ar:"أَوَلَيْسَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِقَادِرٍ عَلَىٰ أَن يَخْلُقَ مِثْلَهُم",tr:"Eveleysellezî halakassemâvâti vel-arda bikâdirin alâ en yahluka mislehum, belâ ve hüvel-hallâkul-alîm."},
    {no:82,ar:"إِنَّمَآ أَمْرُهُ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ",tr:"İnnemâ emruhû izâ erâde şey'en en yekûle lehû kun fe-yekûn."},
    {no:83,ar:"فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ",tr:"Fesubhânellezî biyedihî melekûtu külli şey'in ve ileyhi turce'ûn."},
  ]},
  vakıa:{name:"Vâkıa Suresi",ayets:[
    {no:1,ar:"إِذَا وَقَعَتِ الْوَاقِعَةُ",tr:"İzâ veka'atil-vâkı'ah."},{no:2,ar:"لَيْسَ لِوَقْعَتِهَا كَاذِبَةٌ",tr:"Leyse livak'atihâ kâzibeh."},
    {no:3,ar:"خَافِضَةٌ رَّافِعَةٌ",tr:"Hâfıdatün râfi'ah."},{no:4,ar:"إِذَا رُجَّتِ الْأَرْضُ رَجًّا",tr:"İzâ ruccetil-ardu reccâ."},
    {no:5,ar:"وَبُسَّتِ الْجِبَالُ بَسًّا",tr:"Ve büssetil-cibâlu bessâ."},{no:6,ar:"فَكَانَتْ هَبَاءً مُّنبَثًّا",tr:"Fe-kânet hebâen mümbessâ."},
    {no:7,ar:"وَكُنتُمْ أَزْوَاجًا ثَلَاثَةً",tr:"Ve küntüm ezvâcen selâseh."},{no:8,ar:"فَأَصْحَابُ الْمَيْمَنَةِ مَا أَصْحَابُ الْمَيْمَنَةِ",tr:"Fe-ashâbül-meymeneti mâ ashâbül-meymeneh."},
    {no:9,ar:"وَأَصْحَابُ الْمَشْأَمَةِ مَا أَصْحَابُ الْمَشْأَمَةِ",tr:"Ve ashâbül-meş'emeti mâ ashâbül-meş'emeh."},
    {no:10,ar:"وَالسَّابِقُونَ السَّابِقُونَ",tr:"Ves-sâbikûnes-sâbikûn."},{no:11,ar:"أُولَٰئِكَ الْمُقَرَّبُونَ",tr:"Ülâikel-mukarrebûn."},
    {no:12,ar:"فِي جَنَّاتِ النَّعِيمِ",tr:"Fî cennâtin-naîm."},{no:13,ar:"ثُلَّةٌ مِّنَ الْأَوَّلِينَ",tr:"Süllletün minel-evvelîn."},
    {no:14,ar:"وَقَلِيلٌ مِّنَ الْآخِرِينَ",tr:"Ve kalîlün minel-âhirîn."},{no:15,ar:"عَلَىٰ سُرُرٍ مَّوْضُونَةٍ",tr:"Alâ sürürin mevdûneh."},
    {no:16,ar:"مُتَّكِئِينَ عَلَيْهَا مُتَقَابِلِينَ",tr:"Müttekiîne aleyhâ mütekâbilîn."},{no:17,ar:"يَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُّخَلَّدُونَ",tr:"Yetûfu aleyhim vildânün muhalledûn."},
    {no:18,ar:"بِأَكْوَابٍ وَأَبَارِيقَ وَكَأْسٍ مِّن مَّعِينٍ",tr:"Bi-ekvabin ve ebârîka ve ke'sin min maîn."},
    {no:19,ar:"لَّا يُصَدَّعُونَ عَنْهَا وَلَا يُنزِفُونَ",tr:"Lâ yusadda'ûne anhâ ve lâ yünzifûn."},{no:20,ar:"وَفَاكِهَةٍ مِّمَّا يَتَخَيَّرُونَ",tr:"Ve fâkihetin mimmâ yetehayyerûn."},
    {no:21,ar:"وَلَحْمِ طَيْرٍ مِّمَّا يَشْتَهُونَ",tr:"Ve lahmi tayrin mimmâ yeştehûn."},{no:22,ar:"وَحُورٌ عِينٌ",tr:"Ve hûrun în."},
    {no:23,ar:"كَأَمْثَالِ اللُّؤْلُؤِ الْمَكْنُونِ",tr:"Ke-emsilil-lü'lüil-meknûn."},{no:24,ar:"جَزَاءً بِمَا كَانُوا يَعْمَلُونَ",tr:"Cezâen bimâ kânû ya'melûn."},
    {no:25,ar:"لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا تَأْثِيمًا",tr:"Lâ yesme'ûne fîhâ lağven ve lâ te'sîmâ."},{no:26,ar:"إِلَّا قِيلًا سَلَامًا سَلَامًا",tr:"İllâ kîlen selâmen selâmâ."},
    {no:27,ar:"وَأَصْحَابُ الْيَمِينِ مَا أَصْحَابُ الْيَمِينِ",tr:"Ve ashâbül-yemîni mâ ashâbül-yemîn."},{no:28,ar:"فِي سِدْرٍ مَّخْضُودٍ",tr:"Fî sidrin mahmûd."},
    {no:29,ar:"وَطَلْحٍ مَّنضُودٍ",tr:"Ve talhın mendûd."},{no:30,ar:"وَظِلٍّ مَّمْدُودٍ",tr:"Ve zıllin memdûd."},
    {no:31,ar:"وَمَاءٍ مَّسْكُوبٍ",tr:"Ve mâin meskûb."},{no:32,ar:"وَفَاكِهَةٍ كَثِيرَةٍ",tr:"Ve fâkihetin kesîreh."},
    {no:33,ar:"لَّا مَقْطُوعَةٍ وَلَا مَمْنُوعَةٍ",tr:"Lâ maktûatin ve lâ memnûah."},{no:34,ar:"وَفُرُشٍ مَّرْفُوعَةٍ",tr:"Ve füruşin merfû'ah."},
    {no:35,ar:"إِنَّا أَنشَأْنَاهُنَّ إِنشَاءً",tr:"İnnâ enşe'nâhünne inşâeh."},{no:36,ar:"فَجَعَلْنَاهُنَّ أَبْكَارًا",tr:"Fe-ce'alnâhünne ebkârâ."},
    {no:37,ar:"عُرُبًا أَتْرَابًا",tr:"Üruben etrâbâ."},{no:38,ar:"لِّأَصْحَابِ الْيَمِينِ",tr:"Li-ashâbil-yemîn."},
    {no:39,ar:"ثُلَّةٌ مِّنَ الْأَوَّلِينَ",tr:"Süllletün minel-evvelîn."},{no:40,ar:"وَثُلَّةٌ مِّنَ الْآخِرِينَ",tr:"Ve süllletün minel-âhirîn."},
    {no:41,ar:"وَأَصْحَابُ الشِّمَالِ مَا أَصْحَابُ الشِّمَالِ",tr:"Ve ashâbüş-şimâli mâ ashâbüş-şimâl."},{no:42,ar:"فِي سَمُومٍ وَحَمِيمٍ",tr:"Fî semûmin ve hamîm."},
    {no:43,ar:"وَظِلٍّ مِّن يَحْمُومٍ",tr:"Ve zıllin min yahmûm."},{no:44,ar:"لَّا بَارِدٍ وَلَا كَرِيمٍ",tr:"Lâ bâridin ve lâ kerîm."},
    {no:45,ar:"إِنَّهُمْ كَانُوا قَبْلَ ذَٰلِكَ مُتْرَفِينَ",tr:"İnnehüm kânû kable zâlike mütrefîn."},{no:46,ar:"وَكَانُوا يُصِرُّونَ عَلَى الْحِنثِ الْعَظِيمِ",tr:"Ve kânû yüssirrûne alel-hınsil-azîm."},
    {no:47,ar:"وَكَانُوا يَقُولُونَ أَئِذَا مِتْنَا وَكُنَّا تُرَابًا",tr:"Ve kânû yekûlûne e-izâ mitnâ ve künnâ türâben ve izâmen e-innâ le-meb'ûsûn."},
    {no:48,ar:"أَوَآبَاؤُنَا الْأَوَّلُونَ",tr:"E-ve âbâünel-evvelûn."},{no:49,ar:"قُلْ إِنَّ الْأَوَّلِينَ وَالْآخِرِينَ",tr:"Kul innel-evvelîne vel-âhirîn."},
    {no:50,ar:"لَمَجْمُوعُونَ إِلَىٰ مِيقَاتِ يَوْمٍ مَّعْلُومٍ",tr:"Le-mecmû'ûne ilâ mîkâti yevmin ma'lûm."},
    {no:51,ar:"ثُمَّ إِنَّكُمْ أَيُّهَا الضَّالُّونَ الْمُكَذِّبُونَ",tr:"Sümme inneküm eyyühad-dâllûnel-mükezzibûn."},
    {no:52,ar:"لَآكِلُونَ مِن شَجَرٍ مِّن زَقُّومٍ",tr:"Le-âkilûne min şecerim min zakkûm."},{no:53,ar:"فَمَالِئُونَ مِنْهَا الْبُطُونَ",tr:"Fe-mâliûne minhel-bütûn."},
    {no:54,ar:"فَشَارِبُونَ عَلَيْهِ مِنَ الْحَمِيمِ",tr:"Fe-şâribûne aleyhi minel-hamîm."},{no:55,ar:"فَشَارِبُونَ شُرْبَ الْهِيمِ",tr:"Fe-şâribûne şürbelh-hîm."},
    {no:56,ar:"هَٰذَا نُزُلُهُمْ يَوْمَ الدِّينِ",tr:"Hâzâ nüzülühüm yevmed-dîn."},{no:57,ar:"نَحْنُ خَلَقْنَاكُمْ فَلَوْلَا تُصَدِّقُونَ",tr:"Nahnü halaknâküm fe-lev lâ tusaddikûn."},
    {no:58,ar:"أَفَرَأَيْتُم مَّا تُمْنُونَ",tr:"E-feraeytüm mâ tümnûn."},{no:59,ar:"أَأَنتُمْ تَخْلُقُونَهُ أَمْ نَحْنُ الْخَالِقُونَ",tr:"E-entüm tahlukûnehü em nahnül-hâlikûn."},
    {no:60,ar:"نَحْنُ قَدَّرْنَا بَيْنَكُمُ الْمَوْتَ",tr:"Nahnü kaddernâ beyneküm el-mevte ve mâ nahnü bi-mesbûkîn."},
    {no:61,ar:"عَلَىٰ أَن نُّبَدِّلَ أَمْثَالَكُمْ",tr:"Alâ en nübeddile emsâleküm ve nünşieküm fî mâ lâ ta'lemûn."},
    {no:62,ar:"وَلَقَدْ عَلِمْتُمُ النَّشْأَةَ الْأُولَىٰ فَلَوْلَا تَذَكَّرُونَ",tr:"Ve lekad alimtümün-neş'etel-ûlâ fe-lev lâ tezekkerûn."},
    {no:63,ar:"أَفَرَأَيْتُم مَّا تَحْرُثُونَ",tr:"E-feraeytüm mâ tahrusûn."},{no:64,ar:"أَأَنتُمْ تَزْرَعُونَهُ أَمْ نَحْنُ الزَّارِعُونَ",tr:"E-entüm tezreûnehü em nahnüz-zâriûn."},
    {no:65,ar:"لَوْ نَشَاءُ لَجَعَلْنَاهُ حُطَامًا",tr:"Lev neşâü le-cealnâhü hutâmen fe-zaltüm tefekkeheûn."},
    {no:66,ar:"إِنَّا لَمُغْرَمُونَ",tr:"İnnâ le-müğramûn."},{no:67,ar:"بَلْ نَحْنُ مَحْرُومُونَ",tr:"Bel nahnü mahrûmûn."},
    {no:68,ar:"أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ",tr:"E-feraeytümül-mâellezî teşrebûn."},
    {no:69,ar:"أَأَنتُمْ أَنزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنزِلُونَ",tr:"E-entüm enzetümûhü minel-müzni em nahnül-münzilûn."},
    {no:70,ar:"لَوْ نَشَاءُ جَعَلْنَاهُ أُجَاجًا فَلَوْلَا تَشْكُرُونَ",tr:"Lev neşâü cealnâhü ücâcen fe-lev lâ teşkurûn."},
    {no:71,ar:"أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ",tr:"E-feraeytümün-nârelleti tûrûn."},
    {no:72,ar:"أَأَنتُمْ أَنشَأْتُمْ شَجَرَتَهَا أَمْ نَحْنُ الْمُنشِئُونَ",tr:"E-entüm enşe'tüm şeceretehâ em nahnül-münşiûn."},
    {no:73,ar:"نَحْنُ جَعَلْنَاهَا تَذْكِرَةً وَمَتَاعًا لِّلْمُقْوِينَ",tr:"Nahnü cealnâhâ tezkiraten ve metâan lil-mukviîn."},
    {no:74,ar:"فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ",tr:"Fe-sebbih bismi rabbikel-azîm."},
    {no:75,ar:"فَلَا أُقْسِمُ بِمَوَاقِعِ النُّجُومِ",tr:"Felâ üksimü bi-mevâkı'in-nücûm."},{no:76,ar:"وَإِنَّهُ لَقَسَمٌ لَّوْ تَعْلَمُونَ عَظِيمٌ",tr:"Ve innehû le-kasemün lev ta'lemûne azîm."},
    {no:77,ar:"إِنَّهُ لَقُرْآنٌ كَرِيمٌ",tr:"İnnehü lekur'ânün kerîm."},{no:78,ar:"فِي كِتَابٍ مَّكْنُونٍ",tr:"Fî kitâbin meknûn."},
    {no:79,ar:"لَّا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ",tr:"Lâ yemessühü illel-mutahhürûn."},{no:80,ar:"تَنزِيلٌ مِّن رَّبِّ الْعَالَمِينَ",tr:"Tenzîlün min rabbil-âlemîn."},
    {no:81,ar:"أَفَبِهَٰذَا الْحَدِيثِ أَنتُم مُّدْهِنُونَ",tr:"E-fe-bihâzel-hadîsi entüm müdhinûn."},{no:82,ar:"وَتَجْعَلُونَ رِزْقَكُمْ أَنَّكُمْ تُكَذِّبُونَ",tr:"Ve tec'alûne rızkaküm enneküm tükezzibûn."},
    {no:83,ar:"فَلَوْلَا إِذَا بَلَغَتِ الْحُلْقُومَ",tr:"Fe-lev lâ izâ beleğatil-hulkûm."},{no:84,ar:"وَأَنتُمْ حِينَئِذٍ تَنظُرُونَ",tr:"Ve entüm hîne'izin tenzurûn."},
    {no:85,ar:"وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنكُمْ وَلَٰكِن لَّا تُبْصِرُونَ",tr:"Ve nahnü akrabü ileyhi minküm ve lâkin lâ tübsirûn."},
    {no:86,ar:"فَلَوْلَا إِن كُنتُمْ غَيْرَ مَدِينِينَ",tr:"Fe-lev lâ in küntüm gayre medînîn."},{no:87,ar:"تَرْجِعُونَهَا إِن كُنتُمْ صَادِقِينَ",tr:"Terci'ûnehâ in küntüm sâdikîn."},
    {no:88,ar:"فَأَمَّا إِن كَانَ مِنَ الْمُقَرَّبِينَ",tr:"Fe-emmâ in kâne minel-mukarrebîn."},{no:89,ar:"فَرَوْحٌ وَرَيْحَانٌ وَجَنَّتُ نَعِيمٍ",tr:"Fe-ravhun ve reyhânün ve cennetü naîm."},
    {no:90,ar:"وَأَمَّا إِن كَانَ مِنْ أَصْحَابِ الْيَمِينِ",tr:"Ve emmâ in kâne min ashâbil-yemîn."},{no:91,ar:"فَسَلَامٌ لَّكَ مِنْ أَصْحَابِ الْيَمِينِ",tr:"Fe-selâmün leke min ashâbil-yemîn."},
    {no:92,ar:"وَأَمَّا إِن كَانَ مِنَ الْمُكَذِّبِينَ الضَّالِّينَ",tr:"Ve emmâ in kâne minel-mükezzibîned-dâllîn."},{no:93,ar:"فَنُزُلٌ مِّنْ حَمِيمٍ",tr:"Fe-nüzülün min hamîm."},
    {no:94,ar:"وَتَصْلِيَةُ جَحِيمٍ",tr:"Ve tasliyetü cahîm."},{no:95,ar:"إِنَّ هَٰذَا لَهُوَ حَقُّ الْيَقِينِ",tr:"İnne hâzâ le-hüvel-hakkul-yakîn."},
    {no:96,ar:"فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ",tr:"Fe-sebbih bismi rabbikel-azîm."},
  ]},
  mulk:{name:"Mülk Suresi",ayets:[
    {no:1,ar:"تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ",tr:"Tebârakellezî biyedihil-mülkü ve hüve alâ külli şey'in kadîr."},
    {no:2,ar:"الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ",tr:"Ellezî halakal-mevte vel-hayâte li-yeblüveküm eyyüküm ahsenü amelâ, ve hüvel-azîzül-gafûr."},
    {no:3,ar:"الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ",tr:"Ellezî haleka seb'a semâvâtin tibâkâ, mâ terâ fî halkir-rahmâni min tefâvüt, ferci'il-basara hel terâ min futûr."},
    {no:4,ar:"ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ",tr:"Sümmerci'il-basara kerreteyni yenkalib ileykel-basaru hâsiyen ve hüve hasîr."},
    {no:5,ar:"وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ",tr:"Ve lekad zeyyennes-semâed-dünyâ bi-mesâbîha ve cealnâhâ rucûmen liş-şeyâtîni ve a'tednâ lehüm azâbes-seîr."},
    {no:6,ar:"وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ الْمَصِيرُ",tr:"Ve lillezîne keferû bi-rabbihim azâbü cehennem, ve bi'sel-masîr."},
    {no:7,ar:"إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ",tr:"İzâ ülkû fîhâ semi'û lehâ şehîkan ve hiye tefûr."},
    {no:8,ar:"تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ ۖ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ",tr:"Tekâdü temeyezü minel-gayz, küllemâ ülkıye fîhâ fevcün seelehüm hazenetühâ elem ye'tüküm nezîr."},
    {no:9,ar:"قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا",tr:"Kâlû belâ kad câenâ nezîrun fe-kezzebna ve kulnâ mâ nezzelallâhü min şey'in in entum illâ fî dalâlin kebîr."},
    {no:10,ar:"وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ",tr:"Ve kâlû lev künnâ nesme'u ev na'kılü mâ künnâ fî ashâbis-seîr."},
    {no:11,ar:"فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ",tr:"Fe-i'terefû bi-zenbihim fe-sühkan li-ashâbis-seîr."},
    {no:12,ar:"إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ",tr:"İnnellezîne yehşevne rabbehüm bil-gaybi lehüm mağfiretün ve ecrun kebîr."},
    {no:13,ar:"وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ ۖ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ",tr:"Ve errû kavleküm evic-herû bih, innehü alîmün bi-zâtis-sudûr."},
    {no:14,ar:"أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ",tr:"Elâ ya'lemü men halak, ve hüvel-latîfül-habîr."},
    {no:15,ar:"هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا",tr:"Hüvellezî ceale lekümül-arda zelûlen femşû fî menâkibihâ ve külu min rızkıh, ve ileyhin-nüşûr."},
    {no:16,ar:"أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ",tr:"E-emintüm men fis-semâi en yahsife bi-kümül-arda fe-izâ hiye temûr."},
    {no:17,ar:"أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا",tr:"Em emintüm men fis-semâi en yürsile aleyküm hâsibâ, fe-setâlemûne keyfe nezîr."},
    {no:18,ar:"وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ",tr:"Ve lekad kezzebellezîne min kablihim fe-keyfe kâne nekîr."},
    {no:19,ar:"أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ",tr:"Evelem yerav ilat-tayri fevkahüm sâffâtin ve yakbıdn, mâ yümsikühünne iller-rahmân, innehü bi-külli şey'in basîr."},
    {no:20,ar:"أَمَّنْ هَٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ",tr:"Emen hâzellezî hüve cündün leküm yensurüküm min dûnir-rahmân, inil-kâfirûne illâ fî gurûr."},
    {no:21,ar:"أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ",tr:"Emen hâzellezî yerzüküküm in emseke rizkaü, bel leccû fî utüvvin ve nüfûr."},
    {no:22,ar:"أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ",tr:"Efemen yemşî mükkibben alâ vechihi ehdâ emen yemşî seviyyen alâ sırâtin müstekîm."},
    {no:23,ar:"قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ",tr:"Kul hüvellezî enşeküm ve ceale lekümüs-sem'a vel-ebsâre vel-ef'ideh, kalîlen mâ teşkurûn."},
    {no:24,ar:"قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ",tr:"Kul hüvellezî zereküm fil-ardı ve ileyhi tuhşerûn."},
    {no:25,ar:"وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ",tr:"Ve yekûlûne metâ hâzel-va'dü in küntüm sâdikîn."},
    {no:26,ar:"قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ",tr:"Kul innemel-ilmü indallâhi ve innemâ ene nezîrün mübîn."},
    {no:27,ar:"فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا",tr:"Felemmâ raevhü zülfetenü sîet vücûhüllezîne keferû ve kîle hâzellezî küntüm bihî teddeûn."},
    {no:28,ar:"قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا",tr:"Kul e-raeyteküm in ehlekeniyallâhü ve men meiye ev rahimenâ femen yücîrül-kâfirîne min azâbin elîm."},
    {no:29,ar:"قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا",tr:"Kul hüver-rahmânü âmennâ bihî ve aleyhi tevekkelnâ, fe-setâlemûne men hüve fî dalâlin mübîn."},
    {no:30,ar:"قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ",tr:"Kul e-raeyteküm in esbaha mâüküm gavren femen ye'tîküm bi-mâin meîn."},
  ]},
};

    {no:6,ar:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",tr:"İhdinessirâtel müstekîm."},
    {no:7,ar:"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",tr:"Sirâtallezîne en'amte aleyhim ğayril mağdûbi aleyhim ve leddâllîn."},
  ]},
  // ── 2. BAKARA SON 2 ──
  2:{name:"Bakara (Son 2 Ayet)",ayets:[
    {no:285,ar:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ",tr:"Âmenar-resûlü bimâ ünzile ileyhi min rabbihî vel mü'minûn, küllün âmene billâhi ve melâiketihî ve kütübihî ve rusülih, lâ nüferriku beyne ehadin min rusülih, ve kâlû semi'nâ ve eta'nâ gufrâneke rabbenâ ve ileykel masîr."},
    {no:286,ar:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ",tr:"Lâ yükellifullâhü nefsen illâ vüs'ahâ, lehâ mâ kesebet ve aleyhâ mektesebet, rabbenâ lâ tüâhiznâ in nesînâ ev ahta'nâ, rabbenâ ve lâ tahmil aleynâ isran kemâ hameltehu alellezîne min kablinâ, rabbenâ ve lâ tühammilnâ mâ lâ tâkate lenâ bih, va'fü annâ vağfir lenâ verhamnâ, ente mevlânâ fensurnâ alel kavmil kâfirîn."},
  ]},
  // ── 32. SECDE ──
  32:{name:"Secde",ayets:[
    {no:1,ar:"الم",tr:"Elif. Lâm. Mîm."},
    {no:2,ar:"تَنزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِن رَّبِّ الْعَالَمِينَ",tr:"Tenzîlül kitâbi lâ reybe fîhi min rabbil âlemîn."},
    {no:3,ar:"أَمْ يَقُولُونَ افْتَرَاهُ ۚ بَلْ هُوَ الْحَقُّ مِن رَّبِّكَ لِتُنذِرَ قَوْمًا مَّا أَتَاهُم مِّن نَّذِيرٍ مِّن قَبْلِكَ لَعَلَّهُمْ يَهْتَدُونَ",tr:"Em yekûlûnefterâhü bel hüvel hakku min rabbike litünzira kavmen mâ etâhüm min nezîrin min kablike leallehüm yehtedûn."},
    {no:4,ar:"اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ",tr:"Allâhüllezî halakas semâvâti vel arda ve mâ beynehumâ fî sitteti eyyâmin sümmestevâ alel arş, mâ leküm min dûnihî min veliyyin ve lâ şefî', efelâ tetezekkerûn."},
    {no:5,ar:"يُدَبِّرُ الْأَمْرَ مِنَ السَّمَاءِ إِلَى الْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ أَلْفَ سَنَةٍ مِّمَّا تَعُدُّونَ",tr:"Yüdebbirul emra minesemâi ilel ardı sümme ya'rucü ileyhi fî yevmin kâne mıkdârühû elfe senetin mimmâ ta'üddûn."},
    {no:6,ar:"ذَٰلِكَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْعَزِيزُ الرَّحِيمُ",tr:"Zâlike âlimül ğaybi veşşehâdeti el azîzür rahîm."},
    {no:7,ar:"الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ وَبَدَأَ خَلْقَ الْإِنسَانِ مِن طِينٍ",tr:"Ellezî ahsene külle şey'in halekahü ve bedee halkal insâni min tîn."},
    {no:8,ar:"ثُمَّ جَعَلَ نَسْلَهُ مِن سُلَالَةٍ مِّن مَّاءٍ مَّهِينٍ",tr:"Sümme ceale neslehû min sülâletin min mâin mehîn."},
    {no:9,ar:"ثُمَّ سَوَّاهُ وَنَفَخَ فِيهِ مِن رُّوحِهِ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَّا تَشْكُرُونَ",tr:"Sümme sevvâhü ve nefeha fîhi min rûhihî ve ceale lekümüs sem'a vel ebsâra vel ef'idete kalîlen mâ teşkürûn."},
    {no:10,ar:"وَقَالُوا أَإِذَا ضَلَلْنَا فِي الْأَرْضِ أَإِنَّا لَفِي خَلْقٍ جَدِيدٍ",tr:"Ve kâlû eizâ dallelnâ fil ardı einnâ lefî halkın cedîd, bel hüm bilkâi rabbihim kâfirûn."},
    {no:11,ar:"قُلْ يَتَوَفَّاكُم مَّلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ",tr:"Kul yeteveffâküm melekül mevtillezî vükkile biküm sümme ilâ rabbiküm türce'ûn."},
    {no:12,ar:"وَلَوْ تَرَىٰ إِذِ الْمُجْرِمُونَ نَاكِسُو رُءُوسِهِمْ عِندَ رَبِّهِمْ",tr:"Ve lev terâ izil mücrimûne nâkisû ruûsihim inde rabbihim rabbenâ ebsarnâ ve semi'nâ fercı'nâ na'mel sâlihan innâ mûkinûn."},
    {no:13,ar:"وَلَوْ شِئْنَا لَآتَيْنَا كُلَّ نَفْسٍ هُدَاهَا",tr:"Ve lev şi'nâ le âteynâ külle nefsin hüdâhâ ve lâkin hakkal kavlü minnî le emleenne cehenneme minel cinneti vennâsi ecme'în."},
    {no:14,ar:"فَذُوقُوا بِمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا",tr:"Fezûkû bimâ nesîtüm likâe yevmiküm hâzâ innâ nesînâküm ve zûkû azâbel huldi bimâ küntüm ta'melûn."},
    {no:15,ar:"إِنَّمَا يُؤْمِنُ بِآيَاتِنَا الَّذِينَ إِذَا ذُكِّرُوا بِهَا خَرُّوا سُجَّدًا",tr:"İnnemâ yü'minü biâyâtinellezîne izâ zükkiru bihâ harrû sücceden ve sebbehu bihamdi rabbihim ve hüm lâ yestekbirûn."},
    {no:16,ar:"تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا",tr:"Tetecâfâ cünûbühüm anil medâci' yed'ûne rabbehüm havfen ve tame'an ve mimmâ razaknâhüm yünfikûn."},
    {no:17,ar:"فَلَا تَعْلَمُ نَفْسٌ مَّا أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٍ",tr:"Felâ ta'lemü nefsün mâ uhfiye lehüm min kurrati a'yünin cezâen bimâ kânû ya'melûn."},
    {no:18,ar:"أَفَمَن كَانَ مُؤْمِنًا كَمَن كَانَ فَاسِقًا لَّا يَسْتَوُونَ",tr:"Efemen kâne mü'minan kemen kâne fâsıkan lâ yestevûn."},
    {no:19,ar:"أَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ جَنَّاتُ الْمَأْوَىٰ",tr:"Emmellezîne âmenû ve amilüs sâlihâti felehüm cennâtül me'vâ nüzülen bimâ kânû ya'melûn."},
    {no:20,ar:"وَأَمَّا الَّذِينَ فَسَقُوا فَمَأْوَاهُمُ النَّارُ",tr:"Ve emmellezîne fesakû feme'vâhümün nâr, küllemâ erâdû en yahrucu minhâ üîdû fîhâ ve kîle lehüm zûkû azâbennâr."},
    {no:21,ar:"وَلَنُذِيقَنَّهُم مِّنَ الْعَذَابِ الْأَدْنَىٰ دُونَ الْعَذَابِ الْأَكْبَرِ",tr:"Ve lenüzîkannehüm minel azâbil ednâ dûnel azâbil ekberi leallehüm yarci'ûn."},
    {no:22,ar:"وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِآيَاتِ رَبِّهِ ثُمَّ أَعْرَضَ عَنْهَا",tr:"Ve men azlemü mimmen zükkire biâyâti rabbihî sümme a'rada anhâ innâ minel mücrimîne müntekimûn."},
    {no:23,ar:"وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ فَلَا تَكُن فِي مِرْيَةٍ مِّن لِّقَائِهِ",tr:"Ve lekad âteynâ mûsellkitâbe felâ tekün fî miryetin min lıkâihî ve ce'alnâhü hüdel libenî isrâîl."},
    {no:24,ar:"وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا",tr:"Ve ce'alnâ minhüm eimmeten yehdûne biemrinâ lemmâ saberû ve kânû biâyâtinâ yûkinûn."},
    {no:25,ar:"إِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ",tr:"İnne rabbeke hüve yafsılü beynehüm yevmel kıyâmeti fîmâ kânû fîhi yahtelifûn."},
    {no:26,ar:"أَوَلَمْ يَهْدِ لَهُمْ كَمْ أَهْلَكْنَا مِن قَبْلِهِم مِّنَ الْقُرُونِ",tr:"Evelem yehdi lehüm kem ehleknâ min kablihim minel kurûni yemşûne fî mesâkinihim inne fî zâlike le âyâtin efelâ yesme'ûn."},
    {no:27,ar:"أَوَلَمْ يَرَوْا أَنَّا نَسُوقُ الْمَاءَ إِلَى الْأَرْضِ الْجُرُزِ",tr:"Evelem yerev ennâ nesûkul mâe ilel ardıl cüruzi fe nuhricü bihî zer'an te'külü minhü en'âmühüm ve enfüsühüm efelâ yübsırûn."},
    {no:28,ar:"وَيَقُولُونَ مَتَىٰ هَٰذَا الْفَتْحُ إِن كُنتُمْ صَادِقِينَ",tr:"Ve yekûlûne metâ hâzel fethu in küntüm sâdikîn."},
    {no:29,ar:"قُلْ يَوْمَ الْفَتْحِ لَا يَنفَعُ الَّذِينَ كَفَرُوا إِيمَانُهُمْ",tr:"Kul yevmel fethi lâ yenfeullezîne keferû îmânühüm ve lâ hüm yünzarûn."},
    {no:30,ar:"فَأَعْرِضْ عَنْهُمْ وَانتَظِرْ إِنَّهُم مُّنتَظِرُونَ",tr:"Fea'rıd anhüm ventezır innehüm müntezırûn."},
  ]},
  // ── 36. YÂSİN ── (namaz akışından)
  36:{name:"Yâsin",fromFlow:'yasin'},
  // ── 44. DUHÂN ──
  44:{name:"Duhân",ayets:[
    {no:1,ar:"حم",tr:"Hâ. Mîm."},{no:2,ar:"وَالْكِتَابِ الْمُبِينِ",tr:"Vel kitâbil mübîn."},
    {no:3,ar:"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةٍ مُّبَارَكَةٍ إِنَّا كُنَّا مُنذِرِينَ",tr:"İnnâ enzelnâhü fî leyletim mübârekin innâ künnâ münzirîn."},
    {no:4,ar:"فِيهَا يُفْرَقُ كُلُّ أَمْرٍ حَكِيمٍ",tr:"Fîhâ yüfraku küllü emrin hakîm."},
    {no:5,ar:"أَمْرًا مِّنْ عِندِنَا إِنَّا كُنَّا مُرْسِلِينَ",tr:"Emran min indinâ innâ künnâ murselîn."},
    {no:6,ar:"رَحْمَةً مِّن رَّبِّكَ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ",tr:"Rahmeten min rabbike innehü hüves semîul alîm."},
    {no:7,ar:"رَبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِن كُنتُم مُّوقِنِينَ",tr:"Rabbis semâvâti vel ardı ve mâ beynehumâ in küntüm mûkinîn."},
    {no:8,ar:"لَا إِلَٰهَ إِلَّا هُوَ يُحْيِي وَيُمِيتُ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ",tr:"Lâ ilâhe illâ hüve yuhyî ve yümît, rabbüküm ve rabbü âbâikümel evvelîn."},
    {no:9,ar:"بَلْ هُمْ فِي شَكٍّ يَلْعَبُونَ",tr:"Bel hüm fî şekkin yel'abûn."},
    {no:10,ar:"فَارْتَقِبْ يَوْمَ تَأْتِي السَّمَاءُ بِدُخَانٍ مُّبِينٍ",tr:"Fertekıb yevme te'tîs semâü biduhânin mübîn."},
    {no:11,ar:"يَغْشَى النَّاسَ هَٰذَا عَذَابٌ أَلِيمٌ",tr:"Yağşennâse hâzâ azâbün elîm."},
    {no:12,ar:"رَّبَّنَا اكْشِفْ عَنَّا الْعَذَابَ إِنَّا مُؤْمِنُونَ",tr:"Rabbenekşif annel azâbe innâ mü'minûn."},
    {no:13,ar:"أَنَّىٰ لَهُمُ الذِّكْرَىٰ وَقَدْ جَاءَهُمْ رَسُولٌ مُّبِينٌ",tr:"Ennâ lehümüz zikrâ ve kad câehüm resûlün mübîn."},
    {no:14,ar:"ثُمَّ تَوَلَّوْا عَنْهُ وَقَالُوا مُعَلَّمٌ مَّجْنُونٌ",tr:"Sümme tevellev anhü ve kâlû müallemmün mecnûn."},
    {no:15,ar:"إِنَّا كَاشِفُو الْعَذَابِ قَلِيلًا إِنَّكُمْ عَائِدُونَ",tr:"İnnâ kâşifûl azâbi kalîlen inneküm âidûn."},
    {no:16,ar:"يَوْمَ نَبْطِشُ الْبَطْشَةَ الْكُبْرَىٰ إِنَّا مُنتَقِمُونَ",tr:"Yevme nebtışül batşetel kübrâ innâ müntekimûn."},
    {no:17,ar:"وَلَقَدْ فَتَنَّا قَبْلَهُمْ قَوْمَ فِرْعَوْنَ وَجَاءَهُمْ رَسُولٌ كَرِيمٌ",tr:"Ve lekad fetennâ kablehüm kavme fir'avne ve câehüm resûlün kerîm."},
    {no:18,ar:"أَنْ أَدُّوا إِلَيَّ عِبَادَ اللَّهِ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ",tr:"En eddû ileyye ibâdallâhi innî leküm resûlün emîn."},
    {no:19,ar:"وَأَن لَّا تَعْلُوا عَلَى اللَّهِ إِنِّي آتِيكُم بِسُلْطَانٍ مُّبِينٍ",tr:"Ve en lâ ta'lû alallâhi innî âtîküm bisültânin mübîn."},
    {no:20,ar:"وَإِنِّي عُذْتُ بِرَبِّي وَرَبِّكُمْ أَن تَرْجُمُونِ",tr:"Ve innî üztü birabbî ve rabbiküm en tercümûn."},
    {no:21,ar:"وَإِن لَّمْ تُؤْمِنُوا لِي فَاعْتَزِلُونِ",tr:"Ve in lem tü'minû lî fa'tezilûn."},
    {no:22,ar:"فَدَعَا رَبَّهُ أَنَّ هَٰؤُلَاءِ قَوْمٌ مُّجْرِمُونَ",tr:"Fede'â rabbehü enne hâülâi kavmün mücrimûn."},
    {no:23,ar:"فَأَسْرِ بِعِبَادِي لَيْلًا إِنَّكُم مُّتَّبَعُونَ",tr:"Fesri biibâdî leylen inneküm müttebe'ûn."},
    {no:24,ar:"وَاتْرُكِ الْبَحْرَ رَهْوًا إِنَّهُمْ جُندٌ مُّغْرَقُونَ",tr:"Vetrukel bahra rahven innehüm cündün muğrakûn."},
    {no:25,ar:"كَمْ تَرَكُوا مِن جَنَّاتٍ وَعُيُونٍ",tr:"Kem terakû min cennâtin ve uyûn."},
    {no:26,ar:"وَزُرُوعٍ وَمَقَامٍ كَرِيمٍ",tr:"Ve zürû'in ve makâmin kerîm."},
    {no:27,ar:"وَنَعْمَةٍ كَانُوا فِيهَا فَاكِهِينَ",tr:"Ve ni'metin kânû fîhâ fâkihîn."},
    {no:28,ar:"كَذَٰلِكَ وَأَوْرَثْنَاهَا قَوْمًا آخَرِينَ",tr:"Kezâlike ve eversetnâhâ kavmen âharîn."},
    {no:29,ar:"فَمَا بَكَتْ عَلَيْهِمُ السَّمَاءُ وَالْأَرْضُ وَمَا كَانُوا مُنظَرِينَ",tr:"Femâ beket aleyhimüs semâü vel ardü ve mâ kânû münzarîn."},
    {no:30,ar:"وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ الْمُهِينِ",tr:"Ve lekad necceyenâ benî isrâîle minel azâbil mühîn."},
    {no:31,ar:"مِن فِرْعَوْنَ إِنَّهُ كَانَ عَالِيًا مِّنَ الْمُسْرِفِينَ",tr:"Min fir'avne innehü kâne âliyen minel müsrifîn."},
    {no:32,ar:"وَلَقَدِ اخْتَرْنَاهُمْ عَلَىٰ عِلْمٍ عَلَى الْعَالَمِينَ",tr:"Ve lekadihternâhüm alâ ilmin alel âlemîn."},
    {no:33,ar:"وَآتَيْنَاهُم مِّنَ الْآيَاتِ مَا فِيهِ بَلَاءٌ مُّبِينٌ",tr:"Ve âteynâhüm minel âyâti mâ fîhi belâün mübîn."},
    {no:34,ar:"إِنَّ هَٰؤُلَاءِ لَيَقُولُونَ",tr:"İnne hâülâi leyekûlûn."},
    {no:35,ar:"إِنْ هِيَ إِلَّا مَوْتَتُنَا الْأُولَىٰ وَمَا نَحْنُ بِمُنشَرِينَ",tr:"İn hiye illâ mevtetünel ûlâ ve mâ nahnü bimünşerîn."},
    {no:36,ar:"فَأْتُوا بِآبَائِنَا إِن كُنتُمْ صَادِقِينَ",tr:"Fe'tû biâbâinâ in küntüm sâdikîn."},
    {no:37,ar:"أَهُمْ خَيْرٌ أَمْ قَوْمُ تُبَّعٍ وَالَّذِينَ مِن قَبْلِهِمْ أَهْلَكْنَاهُمْ إِنَّهُمْ كَانُوا مُجْرِمِينَ",tr:"Ehüm hayrun em kavmü tübbe'in vellezîne min kablihim, ehlâknâhüm innehüm kânû mücrimîn."},
    {no:38,ar:"وَمَا خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا لَاعِبِينَ",tr:"Ve mâ halaknes semâvâti vel arda ve mâ beynehumâ lâibîn."},
    {no:39,ar:"مَا خَلَقْنَاهُمَا إِلَّا بِالْحَقِّ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ",tr:"Mâ halaknahümâ illâ bilhakkı ve lâkinne ekserehüm lâ ya'lemûn."},
    {no:40,ar:"إِنَّ يَوْمَ الْفَصْلِ مِيقَاتُهُمْ أَجْمَعِينَ",tr:"İnne yevmel faslı mîkâtühüm ecme'în."},
    {no:41,ar:"يَوْمَ لَا يُغْنِي مَوْلًى عَن مَّوْلًى شَيْئًا وَلَا هُمْ يُنصَرُونَ",tr:"Yevme lâ yuğnî mevlen an mevlen şey'en ve lâ hüm yünsarûn."},
    {no:42,ar:"إِلَّا مَن رَّحِمَ اللَّهُ إِنَّهُ هُوَ الْعَزِيزُ الرَّحِيمُ",tr:"İllâ men rahimallâh innehü hüvel azîzür rahîm."},
    {no:43,ar:"إِنَّ شَجَرَتَ الزَّقُّومِ",tr:"İnne şeceretez zakkûm."},
    {no:44,ar:"طَعَامُ الْأَثِيمِ",tr:"Taâmül esîm."},
    {no:45,ar:"كَالْمُهْلِ يَغْلِي فِي الْبُطُونِ",tr:"Kel muhl yeğlî fil butûn."},
    {no:46,ar:"كَغَلْيِ الْحَمِيمِ",tr:"Keğalyil hamîm."},
    {no:47,ar:"خُذُوهُ فَاعْتِلُوهُ إِلَىٰ سَوَاءِ الْجَحِيمِ",tr:"Huzûhü fa'tilûhü ilâ sevâil cahîm."},
    {no:48,ar:"ثُمَّ صُبُّوا فَوْقَ رَأْسِهِ مِنْ عَذَابِ الْحَمِيمِ",tr:"Sümme subbû fevka re'sihî min azâbil hamîm."},
    {no:49,ar:"ذُقْ إِنَّكَ أَنتَ الْعَزِيزُ الْكَرِيمُ",tr:"Zuk inneke entel azîzül kerîm."},
    {no:50,ar:"إِنَّ هَٰذَا مَا كُنتُم بِهِ تَمْتَرُونَ",tr:"İnne hâzâ mâ küntüm bihî temterûn."},
    {no:51,ar:"إِنَّ الْمُتَّقِينَ فِي مَقَامٍ أَمِينٍ",tr:"İnnel müttekîne fî makâmin emîn."},
    {no:52,ar:"فِي جَنَّاتٍ وَعُيُونٍ",tr:"Fî cennâtin ve uyûn."},
    {no:53,ar:"يَلْبَسُونَ مِن سُندُسٍ وَإِسْتَبْرَقٍ مُّتَقَابِلِينَ",tr:"Yelbisûne min sündüsin ve istabrâkın mütekâbilîn."},
    {no:54,ar:"كَذَٰلِكَ وَزَوَّجْنَاهُم بِحُورٍ عِينٍ",tr:"Kezâlike ve zevvecnâhüm bihûrin în."},
    {no:55,ar:"يَدْعُونَ فِيهَا بِكُلِّ فَاكِهَةٍ آمِنِينَ",tr:"Yed'ûne fîhâ bikülli fâkihetin âminîn."},
    {no:56,ar:"لَا يَذُوقُونَ فِيهَا الْمَوْتَ إِلَّا الْمَوْتَةَ الْأُولَىٰ",tr:"Lâ yezûkûne fîhel mevte illel mevtetel ûlâ ve vakâhüm azâbel cahîm."},
    {no:57,ar:"فَضْلًا مِّن رَّبِّكَ ذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ",tr:"Fadlen min rabbik, zâlike hüvel fevzül azîm."},
    {no:58,ar:"فَإِنَّمَا يَسَّرْنَاهُ بِلِسَانِكَ لَعَلَّهُمْ يَتَذَكَّرُونَ",tr:"Fe innemâ yessernâhü bilisânike leallehüm yetezekkerûn."},
    {no:59,ar:"فَارْتَقِبْ إِنَّهُم مُّرْتَقِبُونَ",tr:"Fertekıb innehüm mürtekibûn."},
  ]},
  // ── 55. RAHMÂN ──
  55:{name:"Rahmân",ayets:[
    {no:1,ar:"الرَّحْمَنُ",tr:"Errahmân."},{no:2,ar:"عَلَّمَ الْقُرْآنَ",tr:"Allemél kur'ân."},
    {no:3,ar:"خَلَقَ الْإِنسَانَ",tr:"Halekal insân."},{no:4,ar:"عَلَّمَهُ الْبَيَانَ",tr:"Allemehül beyân."},
    {no:5,ar:"الشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ",tr:"Eşşemsü vel kameru bihüsbân."},
    {no:6,ar:"وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ",tr:"Vennecmü veşşecerul yescüdân."},
    {no:7,ar:"وَالسَّمَاءَ رَفَعَهَا وَوَضَعَ الْمِيزَانَ",tr:"Vesseamâe refeahâ ve vedeal mîzân."},
    {no:8,ar:"أَلَّا تَطْغَوْا فِي الْمِيزَانِ",tr:"Ellâ tatğav fil mîzân."},
    {no:9,ar:"وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ",tr:"Ve ekîmûl vezne bil kıstı ve lâ tuhsirul mîzân."},
    {no:10,ar:"وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ",tr:"Vel arda vadeahâ lil enâm."},
    {no:11,ar:"فِيهَا فَاكِهَةٌ وَالنَّخْلُ ذَاتُ الْأَكْمَامِ",tr:"Fîhâ fâkihetün vennahl zâtül ekmâm."},
    {no:12,ar:"وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانُ",tr:"Vel habbü zûl asfi ver reyhân."},
    {no:13,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:14,ar:"خَلَقَ الْإِنسَانَ مِن صَلْصَالٍ كَالْفَخَّارِ",tr:"Halekal insâne min salsâlin kel fahhâr."},
    {no:15,ar:"وَخَلَقَ الْجَانَّ مِن مَّارِجٍ مِّن نَّارٍ",tr:"Ve halekal cânn min mâricin min nâr."},
    {no:16,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:17,ar:"رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ",tr:"Rabbül meşrikayni ve rabbül mağribbeyn."},
    {no:18,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:19,ar:"مَرَجَ الْبَحْرَيْنِ يَلْتَقِيَانِ",tr:"Meracel bahrayni yeltekıyân."},
    {no:20,ar:"بَيْنَهُمَا بَرْزَخٌ لَّا يَبْغِيَانِ",tr:"Beynehümâ berzehun lâ yebğıyân."},
    {no:21,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:22,ar:"يَخْرُجُ مِنْهُمَا اللُّؤْلُؤُ وَالْمَرْجَانُ",tr:"Yahrucu minhumellü'lüü vel mercân."},
    {no:23,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:24,ar:"وَلَهُ الْجَوَارِ الْمُنشَآتُ فِي الْبَحْرِ كَالْأَعْلَامِ",tr:"Ve lehül cevâril münşeâtü fil bahri kel a'lâm."},
    {no:25,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:26,ar:"كُلُّ مَنْ عَلَيْهَا فَانٍ",tr:"Küllü men aleyhâ fân."},
    {no:27,ar:"وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ",tr:"Ve yebkâ vechü rabbike zül celâli vel ikrâm."},
    {no:28,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:29,ar:"يَسْأَلُهُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ",tr:"Yes'elühü men fis semâvâti vel ard, külle yevmin hüve fî şe'n."},
    {no:30,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:31,ar:"سَنَفْرُغُ لَكُمْ أَيُّهَ الثَّقَلَانِ",tr:"Senefruğu leküm eyyühez sekâlân."},
    {no:32,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:33,ar:"يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ إِنِ اسْتَطَعْتُمْ أَن تَنفُذُوا مِنْ أَقْطَارِ السَّمَاوَاتِ وَالْأَرْضِ فَانفُذُوا لَا تَنفُذُونَ إِلَّا بِسُلْطَانٍ",tr:"Yâ ma'şerel cinni vel insi inistatatum en tenfuzû min aktâris semâvâti vel ardı fenfuzû, lâ tenfuzûne illâ bisültân."},
    {no:34,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:35,ar:"يُرْسَلُ عَلَيْكُمَا شُوَاظٌ مِّن نَّارٍ وَنُحَاسٌ فَلَا تَنتَصِرَانِ",tr:"Yürselu aleyküma şüvâzun min nârin ve nühâsun felâ tentesırân."},
    {no:36,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:37,ar:"فَإِذَا انشَقَّتِ السَّمَاءُ فَكَانَتْ وَرْدَةً كَالدِّهَانِ",tr:"Feizânşakkatıs semâü fekânet verdeten keddihân."},
    {no:38,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:39,ar:"فَيَوْمَئِذٍ لَّا يُسْأَلُ عَن ذَنبِهِ إِنسٌ وَلَا جَانٌّ",tr:"Feyevmeizin lâ yüs'elü an zenbihî insün ve lâ cânn."},
    {no:40,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:41,ar:"يُعْرَفُ الْمُجْرِمُونَ بِسِيمَاهُمْ فَيُؤْخَذُ بِالنَّوَاصِي وَالْأَقْدَامِ",tr:"Yu'raful mücrimûne bisîmâhüm feyü'hazu binnâvasî vel akdâm."},
    {no:42,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:43,ar:"هَٰذِهِ جَهَنَّمُ الَّتِي يُكَذِّبُ بِهَا الْمُجْرِمُونَ",tr:"Hâzihî cehennemülletî yükezzibü bihel mücrimûn."},
    {no:44,ar:"يَطُوفُونَ بَيْنَهَا وَبَيْنَ حَمِيمٍ آنٍ",tr:"Yetûfûne beynehâ ve beyne hamîmin ân."},
    {no:45,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:46,ar:"وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ",tr:"Ve limen hâfe mekâme rabbihî cennetan."},
    {no:47,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:48,ar:"ذَوَاتَا أَفْنَانٍ",tr:"Zevâtâ efnân."},{no:49,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:50,ar:"فِيهِمَا عَيْنَانِ تَجْرِيَانِ",tr:"Fîhimâ aynâni tecriyan."},{no:51,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:52,ar:"فِيهِمَا مِن كُلِّ فَاكِهَةٍ زَوْجَانِ",tr:"Fîhimâ min külli fâkihetin zevçân."},{no:53,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:54,ar:"مُتَّكِئِينَ عَلَىٰ فُرُشٍ بَطَائِنُهَا مِنْ إِسْتَبْرَقٍ",tr:"Müttekiîne alâ füruşin batâinühâ min istabrâk, ve ceneL cenneteyni dân."},
    {no:55,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:56,ar:"فِيهِنَّ قَاصِرَاتُ الطَّرْفِ لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ",tr:"Fîhinne kâsırâtüt tarfi lem yatmishünne insün kablehüm ve lâ cânn."},
    {no:57,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:58,ar:"كَأَنَّهُنَّ الْيَاقُوتُ وَالْمَرْجَانُ",tr:"Keennehünnel yâkûtü vel mercân."},{no:59,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:60,ar:"هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ",tr:"Hel cezâül ihsâni illel ihsân."},{no:61,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:62,ar:"وَمِن دُونِهِمَا جَنَّتَانِ",tr:"Ve min dûnihimâ cennetan."},{no:63,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:64,ar:"مُدْهَامَّتَانِ",tr:"Müdhâmmetân."},{no:65,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:66,ar:"فِيهِمَا عَيْنَانِ نَضَّاخَتَانِ",tr:"Fîhimâ aynâni naddâhatân."},{no:67,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:68,ar:"فِيهِمَا فَاكِهَةٌ وَنَخْلٌ وَرُمَّانٌ",tr:"Fîhimâ fâkihetün ve nahlün ve rummân."},{no:69,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:70,ar:"فِيهِنَّ خَيْرَاتٌ حِسَانٌ",tr:"Fîhinne hayrâtün hısân."},{no:71,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:72,ar:"حُورٌ مَّقْصُورَاتٌ فِي الْخِيَامِ",tr:"Hûrun meksûrâtün fil hıyâm."},{no:73,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:74,ar:"لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ",tr:"Lem yatmishünne insün kablehüm ve lâ cânn."},{no:75,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:76,ar:"مُتَّكِئِينَ عَلَىٰ رَفْرَفٍ خُضْرٍ وَعَبْقَرِيٍّ حِسَانٍ",tr:"Müttekiîne alâ refrefin hudrin ve abkariyyin hısân."},{no:77,ar:"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ",tr:"Febieyyi âlâi rabbiküma tükezzibân."},
    {no:78,ar:"تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ",tr:"Tebârakesmü rabbike zil celâli vel ikrâm."},
  ]},
